<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NORD ERP</title>
<meta name="theme-color" content="#0F172E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/nord-icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORD ERP">
<style>
  :root{
    --azul-900:#0F172E; --azul:#1E2D4A; --azul-600:#34466A; --azul-400:#6B7B9C;
    --dorado:#C8A96E; --crema:#F4F1EA;
    --bg:#F4F1EA; --card:#ffffff; --ink:#0F172E; --muted:#6B7280; --line:#E6E1D6;
    --green:#1f9d5b; --green-bg:#e7f6ee; --red:#d64545; --red-bg:#fbeaea; --amber:#c98a1e; --amber-bg:#fbf3e2;
    --nav-h:64px; --shadow:0 2px 10px rgba(15,23,46,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}

  /* LOGIN */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 100% at 50% 0%, #1a2b4a 0%, #0F172E 70%)}
  .login-card{background:var(--card);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
  .login-card img{width:76px;height:76px;border-radius:18px;margin-bottom:14px}
  .login-card h1{margin:0 0 4px;font-size:20px;letter-spacing:.02em}
  .login-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
  .login-card input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;outline:none;margin-bottom:12px;text-align:center}
  .login-card input:focus{border-color:var(--dorado)}
  .login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
    padding:14px 18px;font-weight:700;font-size:15px;background:var(--azul-900);color:#fff;width:100%}
  .btn:active{transform:scale(.99)}
  .btn.gold{background:var(--dorado);color:var(--azul-900)}
  .btn.ghost{background:transparent;color:var(--azul-900);border:1.5px solid var(--line)}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}
  .btn:disabled{opacity:.55}

  /* APP SHELL */
  #app{display:none;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:20;background:var(--azul-900);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
  header .h-title{font-size:17px;font-weight:800;letter-spacing:.02em}
  header .h-sub{font-size:11px;color:var(--azul-400);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
  header .h-actions{display:flex;gap:8px}
  .icon-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:11px;font-size:17px;display:grid;place-items:center}

  #view{padding:16px 16px 24px;max-width:640px;margin:0 auto}
  .view-title{font-size:22px;font-weight:800;margin:2px 0 14px}

  /* BOTTOM NAV */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -2px 14px rgba(15,23,46,.06)}
  nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding-top:8px}
  nav button .ic{font-size:20px;line-height:1}
  nav button.active{color:var(--azul-900)}
  nav button.active .ic{transform:translateY(-1px)}

  /* CARDS */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .kpi .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.hl{background:linear-gradient(135deg,#1a2b4a,#0F172E);color:#fff;border:none}
  .kpi.hl .lbl{color:var(--azul-400)} .kpi.hl .sub{color:#b9c4da}
  .kpi.gold{background:linear-gradient(135deg,#d8bd88,#C8A96E);border:none;color:var(--azul-900)}
  .kpi.gold .lbl{color:#6b551f}

  .section-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 2px 10px}

  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:13px 14px 13px 40px;border:1.5px solid var(--line);border-radius:13px;outline:none;background:#fff}
  .search input:focus{border-color:var(--dorado)}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1;min-width:0}
  .row .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:12.5px;color:var(--muted);margin-top:1px}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .chip.g{background:var(--green-bg);color:var(--green)} .chip.r{background:var(--red-bg);color:var(--red)} .chip.a{background:var(--amber-bg);color:var(--amber)}
  .chip.n{background:#eef1f6;color:var(--azul-600)}

  .talles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .talle{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;min-width:58px;text-align:center;background:#fff}
  .talle .t{font-weight:800;font-size:14px}
  .talle .s{font-size:11px;margin-top:2px;font-weight:700}
  .talle.ok .s{color:var(--green)} .talle.low .s{color:var(--amber)} .talle.no{opacity:.5} .talle.no .s{color:var(--red)}
  .talle.add{cursor:pointer} .talle.add:active{border-color:var(--dorado);background:var(--crema)}

  .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#eef1f6;flex:0 0 auto}
  .thumb.ph{display:grid;place-items:center;font-size:22px}
  #cart-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);z-index:25;
    display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 12px;padding:13px 18px;border-radius:14px;
    background:var(--azul-900);color:#fff;box-shadow:0 6px 20px rgba(15,23,46,.3);font-weight:700;font-size:14px;cursor:pointer;max-width:616px}
  #cart-bar.show{display:flex}
  #cart-bar .cb-total{font-size:17px;font-weight:800}
  .sheet-foto{width:100%;max-height:170px;object-fit:cover;border-radius:14px;margin-bottom:12px}
  .filters{margin-bottom:10px}
  .chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .chips-row::-webkit-scrollbar{display:none}
  .chips-row{scrollbar-width:none}
  .fchip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--azul-600);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
  .fchip.on{background:var(--azul-900);color:#fff;border-color:var(--azul-900)}

  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--azul-900);border-radius:50%;animation:spin .7s linear infinite;margin:36px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* CART */
  .cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .qty button{width:34px;height:34px;border:none;background:#fff;font-size:18px;font-weight:700;color:var(--azul-900)}
  .qty span{min-width:30px;text-align:center;font-weight:800;font-size:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fff}
  .field input:focus,.field select:focus{border-color:var(--dorado)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tot-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
  .tot-line.big{font-size:19px;font-weight:800;border-top:1.5px solid var(--line);margin-top:6px;padding-top:12px}
  .tot-line .disc{color:var(--green)}

  /* MODAL / SHEET */
  .sheet-bg{position:fixed;inset:0;background:rgba(15,23,46,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(30px);transition:transform .22s}
  .sheet-bg.open .sheet{transform:translateY(0)}
  .sheet h3{margin:0 0 3px;font-size:19px}
  .sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .grabber{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);
    background:var(--azul-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}

  .seg{display:flex;background:#eef1f6;border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--azul-900);box-shadow:var(--shadow)}

  /* CHART */
  .chart-cap{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <img src="/nord-icon.svg" alt="NORD">
    <h1>NORD ERP</h1>
    <p>Gestión — stock, ventas y cobros</p>
    <input type="password" id="pwd" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" onclick="login()" id="login-btn">Ingresar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="icon-btn" id="back-btn" onclick="goBack()" title="Volver" style="display:none;font-size:22px">‹</button>
      <div>
        <div class="h-sub" id="h-sub">NORD Uniformes</div>
        <div class="h-title" id="h-title">Inicio</div>
      </div>
    </div>
    <div class="h-actions">
      <button class="icon-btn" onclick="refresh()" title="Actualizar">⟳</button>
      <button class="icon-btn" onclick="logout()" title="Salir">⎋</button>
    </div>
  </header>

  <div id="view"><div class="spinner"></div></div>

  <div id="cart-bar" onclick="scrollToCheckout()">
    <span id="cart-bar-txt">Ver pedido</span>
    <span class="cb-total" id="cart-bar-total">$0</span>
  </div>

  <nav>
    <button data-tab="inicio"   class="active" onclick="go('inicio')"><span class="ic">🏠</span>Inicio</button>
    <button data-tab="stock"    onclick="go('stock')"><span class="ic">📦</span>Stock</button>
    <button data-tab="vender"   onclick="go('vender')"><span class="ic">🛒</span>Vender</button>
    <button data-tab="pedidos"  onclick="go('pedidos')"><span class="ic">🧾</span>Pedidos</button>
    <button data-tab="ordenes"  onclick="go('ordenes')"><span class="ic">📋</span>Órdenes</button>
  </nav>
</div>

<div class="sheet-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────── ESTADO
let TOKEN = localStorage.getItem("nord_erp_token") || "";
let TAB = "inicio";
let navStack = [];      // pila de pantallas para "volver atrás"
let sheetOpen = false;  // hay un panel (modal) abierto
const DATA = { stock:null, stockFlat:null, clientes:null, pedidos:null, dashboard:null, ordenes:null };
let cart = [];
let venta = { cliente:null, descuento:0, envio:0, pago:"Transf. Banc." };

const $ = (s,el=document)=>el.querySelector(s);
const fmt = (n)=> "$" + Math.round(Number(n)||0).toLocaleString("es-AR");
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayAR = ()=> new Date().toLocaleDateString("en-US",{timeZone:"America/Argentina/Buenos_Aires"});

function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); setTimeout(()=>t.className="toast",2600); }

// ─────────────────────────────────────────────────────────────── API
async function api(action, opts={}){
  const res = await fetch(`/api/erp?action=${action}`, {
    method: opts.method||"GET",
    headers: { "Content-Type":"application/json", "Authorization":"Bearer "+TOKEN },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status===401){ logout(); throw new Error("Sesión expirada, ingresá de nuevo"); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ("Error "+res.status));
  return data;
}

// ─────────────────────────────────────────────────────────────── AUTH
async function login(){
  const pwd = $("#pwd").value;
  const btn = $("#login-btn"); btn.disabled=true; btn.textContent="Ingresando…";
  try{
    const r = await fetch("/api/admin/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pwd})});
    const d = await r.json();
    if(d.ok){ TOKEN=d.token; localStorage.setItem("nord_erp_token",TOKEN); showApp(); }
    else { $("#login-err").textContent="Contraseña incorrecta"; }
  }catch(e){ $("#login-err").textContent="Error de conexión"; }
  btn.disabled=false; btn.textContent="Ingresar";
}
function logout(){ TOKEN=""; localStorage.removeItem("nord_erp_token"); $("#app").style.display="none"; $("#login").style.display="flex"; }
function showApp(){ $("#login").style.display="none"; $("#app").style.display="block"; navStack=[]; sheetOpen=false; TAB="inicio"; history.replaceState({tab:"inicio"},""); go("inicio",{push:false}); }

// ─────────────────────────────────────────────────────────────── NAV
const TITLES = {inicio:"Inicio", stock:"Stock", vender:"Vender", pedidos:"Pedidos", ordenes:"Órdenes"};
function go(tab,opts){
  opts=opts||{};
  if(opts.push!==false && TAB!==tab){ navStack.push(TAB); history.pushState({tab},""); }
  TAB=tab;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  $("#h-title").textContent = TITLES[tab];
  window.scrollTo(0,0);
  render();
  updateCartBar();
  updateBack();
}
function goBack(){
  if(sheetOpen){ closeSheet(); return; }
  if(navStack.length) history.back();   // dispara popstate → navega a la anterior
}
function updateBack(){ const b=$("#back-btn"); if(b) b.style.display=(sheetOpen||navStack.length>0)?"grid":"none"; }
function refresh(){ DATA[mapData(TAB)] = null; render(true); toast("Actualizado"); }
function mapData(tab){ return tab==="inicio"?"dashboard": tab==="vender"?"stock": tab; }

async function render(force){
  const v = $("#view");
  if(TAB==="inicio")   return viewInicio(v,force);
  if(TAB==="stock")    return viewStock(v,force);
  if(TAB==="vender")   return viewVender(v,force);
  if(TAB==="pedidos")  return viewPedidos(v,force);
  if(TAB==="ordenes")  return viewOrdenes(v,force);
}
function loading(v){ v.innerHTML='<div class="spinner"></div>'; }
function errBox(v,e){ v.innerHTML=`<div class="empty">⚠️ ${esc(e.message)}<br><br><button class="btn ghost sm" onclick="render(true)">Reintentar</button></div>`; }

// ─────────────────────────────────────────────────────────────── INICIO / DASHBOARD
async function viewInicio(v,force){
  try{
    if(force||!DATA.dashboard){ loading(v); DATA.dashboard = await api("dashboard"); }
    const d = DATA.dashboard;
    const maxV = Math.max(1, ...d.serie.map(s=>s.ventas));
    const bars = d.serie.map((s,i)=>{
      const h = Math.round((s.ventas/maxV)*100);
      return `<div class="bar" data-i="${i}" style="height:${Math.max(h,2)}%" title="${esc(s.label)}"></div>`;
    }).join("");
    const gPts = d.serie.map((s,i)=>{
      const x = (i/(d.serie.length-1))*100;
      const y = 100 - Math.min(100,(s.ganancia/maxV)*100);
      return `${x},${y}`;
    }).join(" ");
    const labels = d.serie.map((s,i)=> i%2===0?`<span>${esc(s.label.split(" ")[0])}</span>`:`<span></span>`).join("");

    v.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi hl"><div class="lbl">Ventas del mes</div><div class="val">${fmt(d.ventasMes)}</div><div class="sub">Año: ${fmt(d.ventasAnio)}</div></div>
        <div class="kpi gold"><div class="lbl">Ganancia mes</div><div class="val">${fmt(d.gananciaMes)}</div><div class="sub">Año: ${fmt(d.gananciaAnio)}</div></div>
      </div>
      <div class="kpi-grid" style="margin-top:12px">
        <div class="kpi"><div class="lbl">Prendas del mes</div><div class="val">${(d.prendasMes||0).toLocaleString("es-AR")}</div><div class="sub">Año: ${(d.prendasAnio||0).toLocaleString("es-AR")} u.</div></div>
        <div class="kpi" onclick="window._pedFilter='debe';go('pedidos')">
          <div class="lbl">Cobros pendientes</div>
          <div class="val" style="color:${d.totalPendiente>0?'var(--red)':'var(--green)'}">${fmt(d.totalPendiente)}</div>
          <div class="sub">${d.pendientesCount} sin saldar · ver →</div>
        </div>
      </div>

      <div class="section-h">Ventas por mes (últimos 12)</div>
      <div class="card">
        <div style="display:flex;align-items:flex-end;gap:4px;height:130px" id="bars">${bars}</div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="display:block;width:100%;height:130px;margin-top:-130px;pointer-events:none;overflow:visible">
          <polyline points="${gPts}" fill="none" stroke="var(--dorado)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:8px">${labels}</div>
        <div class="chart-cap" id="chart-cap">Tocá una barra para ver el detalle</div>
        <div class="legend"><span><i style="background:var(--azul-900)"></i>Ventas</span><span><i style="background:var(--dorado)"></i>Ganancia</span></div>
      </div>

      <div class="section-h">Top prendas vendidas</div>
      <div class="card">${
        d.topProductos.length ? d.topProductos.map(p=>`
          <div class="row"><div class="grow"><div class="name">${esc(p.nombre)}</div><div class="meta">${fmt(p.ventas)} en ventas</div></div>
          <span class="chip n">${p.qty} u.</span></div>`).join("")
        : '<div class="empty">Sin datos todavía</div>'
      }</div>`;

    // estilo barras + interacción
    document.querySelectorAll("#bars .bar").forEach(b=>{
      b.style.flex="1"; b.style.background="var(--azul-900)"; b.style.borderRadius="4px 4px 0 0"; b.style.minHeight="2px"; b.style.opacity=".9";

  products.forEach(p=>p.talles.forEach(t=>flat.push({nombre:p.nombre,colegio:p.colegio,talle:t.talle,sku:t.sku,stock:t.stock,precio:t.precio,costo:t.costo})));
  return flat;
}
function talleClass(s){ return s<=0?"no": s<=3?"low":"ok"; }
async function viewStock(v,force){

const CARD_SURCHARGE = 1.15; // tarjeta = precio de lista = transferencia x1.15 (igual que la web)
function isCard(){ return /nave|tarjeta/i.test(venta.pago); }
function unitPrice(i){ return isCard()? Math.round(i.precio*CARD_SURCHARGE) : i.precio; }
function cartSubtotal(){ return cart.reduce((s,i)=>s+unitPrice(i)*i.qty,0); }
function cartTotal(){ return Math.max(0, cartSubtotal() - (venta.descuento||0) + (venta.envio||0)); }

async function viewVender(v,force){

function renderFilters(){
  const box=$("#v-filters"); if(!box) return;

    const cur=kind==="cat"?(window._venderCat||""):(window._venderGen||"");

  };
  let html="";
  if(cats.length>1) html+=`<div class="chips-row">${chip("cat","","Todas")}${cats.map(c=>chip("cat",c,c)).join("")}</div>`;
  if(gens.length>1) html+=`<div class="chips-row"${cats.length>1?' style="margin-top:8px"':''}>${chip("gen","","Todos")}${gens.map(g=>chip("gen",g,g)).join("")}</div>`;
  box.innerHTML=html;
}
function setFilter(kind,val){ if(kind==="cat")window._venderCat=val; else window._venderGen=val; renderFilters(); drawResults(window._venderQ||""); }
function renderCliente(){
  const b=$("#v-cliente-btn"); if(!b) return;

  b.textContent = c ? `✓ ${c.nombre} ${c.apellido||""}`.trim() : "Elegir o crear cliente";

  b.style.color = c ? "var(--green)" : "var(--azul-900)";
}
// Lista a nivel PRENDA (una fila por prenda). Al tocar se elige el talle.
function drawResults(q){
  const box=$("#v-results"); if(!box) return;
  const cat=window._venderCat||"", gen=window._venderGen||"";
  const res=(DATA.stock||[]).filter(p=>
    (!q || p.nombre.toLowerCase().includes(q)) &&
    (!cat || (p.categorias||[]).includes(cat)) &&
    (!gen || p.genero===gen));
  box.innerHTML = res.length? res.map(p=>{
    const tot=p.talles.reduce((s,t)=>s+t.stock,0);
    const precios=p.talles.map(t=>t.precio).filter(x=>x>0);
    const precio=precios.length?Math.min(...precios):0;
    const enPedido=cart.filter(i=>i.nombre===p.nombre).reduce((s,i)=>s+i.qty,0);
    return `<div class="card" style="margin-bottom:10px;cursor:pointer" onclick='openTalle(${JSON.stringify(p.nombre)})'>
      <div class="row" style="padding:0">
        ${p.foto?`<img class="thumb" src="${esc(p.foto)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'👕'}))">`:'<div class="thumb ph">👕</div>'}
        <div class="grow"><div class="name">${esc(p.nombre)}</div><div class="meta">desde ${fmt(precio)} · ${tot} u. en stock</div></div>
        ${enPedido?`<span class="chip g">${enPedido} en pedido</span>`:'<span style="color:var(--dorado);font-size:24px;line-height:1">＋</span>'}
      </div>
    </div>`;
  }).join("") : '<div class="empty">Sin resultados</div>';
}
function openTalle(nombre){
  const p=(DATA.stock||[]).find(x=>x.nombre===nombre); if(!p) return;
  openSheet(`<div class="grabber"></div>
    ${p.foto?`<img class="sheet-foto" src="${esc(p.foto)}" onerror="this.style.display='none'">`:''}
    <h3>${esc(p.nombre)}</h3><p class="sub">Elegí el talle y la cantidad</p>
    <div id="talle-rows">${talleRows(p)}</div>
    <button class="btn" style="margin-top:6px" onclick="closeSheet()">Listo</button>`);
}
function talleRows(p){
  return p.talles.map(t=>{
    const q=cartQtyFor(t.sku,t.talle,p.nombre);
    const arg=JSON.stringify({sku:t.sku,talle:t.talle,nombre:p.nombre,precio:t.precio,stock:t.stock}).replace(/'/g,"&#39;");
    const over = q>t.stock;
    return `<div class="row">
      <div class="grow"><div class="name">Talle ${esc(t.talle)}</div>
        <div class="meta">${fmt(t.precio)} · stock ${t.stock}${t.stock<=0?' · <span style="color:var(--red)">sin stock</span>':''}${over?` · <span style="color:var(--amber)">pedís ${q}</span>`:''}</div></div>
      <div class="qty"><button onclick='setQty(${arg},-1)'>−</button><span>${q}</span><button onclick='setQty(${arg},1)'>+</button></div>
    </div>`;
  }).join("");
}
function cartQtyFor(sku,talle,nombre){ const i=cart.find(x=>x.sku===sku&&x.talle===talle&&x.nombre===nombre); return i?i.qty:0; }
function setQty(r,delta){
  let i=cart.find(x=>x.sku===r.sku&&x.talle===r.talle&&x.nombre===r.nombre);
  if(!i && delta>0){ i={nombre:r.nombre,talle:r.talle,sku:r.sku,precio:r.precio,qty:0,stock:r.stock}; cart.push(i); }
  if(i){
    if(i.stock==null) i.stock=r.stock;
    i.qty+=delta;
    if(i.qty<=0) cart=cart.filter(x=>x!==i);
    else if(delta>0 && r.stock>=0 && i.qty>r.stock) toast(`⚠ Sólo hay ${r.stock} en stock — el resto queda a pedido`, true);
  }
  const cont=$("#talle-rows"); if(cont){ const p=(DATA.stock||[]).find(x=>x.nombre===r.nombre); if(p) cont.innerHTML=talleRows(p); }
  drawResults(window._venderQ||""); drawCart();
}
function chQty(idx,d){ cart[idx].qty+=d; if(cart[idx].qty<=0)cart.splice(idx,1); drawCart(); }
function clearCart(){ cart=[]; drawCart(); drawResults(window._venderQ||""); }
function drawCart(){
  const c=$("#v-cart"); if(!c) return;
  if(!cart.length){ c.innerHTML='<div class="empty">Todavía no agregaste prendas</div>'; drawCheckout(); updateCartBar(); return; }
  const n=cart.reduce((s,i)=>s+i.qty,0);
  c.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:12px;color:var(--muted);font-weight:700">${n} prenda${n!==1?'s':''}</span>
      <button class="btn ghost sm" onclick="clearCart()">Vaciar</button></div>` +
    cart.map((i,idx)=>`
    <div class="cart-item">
      <div class="grow"><div class="name">${esc(i.nombre)} · T${esc(i.talle)}</div><div class="meta">${fmt(unitPrice(i))} c/u · ${fmt(unitPrice(i)*i.qty)}${(i.stock!=null && i.qty>i.stock)?` · <span style="color:var(--amber)">⚠ supera stock (${i.stock})</span>`:''}</div></div>
      <div class="qty"><button onclick="chQty(${idx},-1)">−</button><span>${i.qty}</span><button onclick="chQty(${idx},1)">+</button></div>
    </div>`).join("");
  drawCheckout();
  updateCartBar();
}
function updateCartBar(){
  const bar=$("#cart-bar"); if(!bar) return;
  const n=cart.reduce((s,i)=>s+i.qty,0);
  if(TAB==="vender" && n>0){
    $("#cart-bar-txt").textContent=`${n} prenda${n!==1?'s':''} · Ver pedido ↓`;
    $("#cart-bar-total").textContent=fmt(cartTotal());
    bar.classList.add("show");
  } else bar.classList.remove("show");
}
function scrollToCheckout(){ ($("#v-checkout")||$("#v-cart"))?.scrollIntoView({behavior:"smooth",block:"start"}); }
function drawCheckout(){
  const el=$("#v-checkout"); if(!el) return;
  if(!cart.length){ el.innerHTML=""; return; }
  el.innerHTML = `
    <div class="card" style="margin-top:12px">
      <div class="field"><label>Forma de pago</label>
        <select id="v-pago" onchange="venta.pago=this.value;drawCart()">
          <option ${venta.pago==="Transf. Banc."?"selected":""}>Transf. Banc.</option>
          <option ${venta.pago==="Efectivo"?"selected":""}>Efectivo</option>

      </div>
      <div class="two">

        <div class="field"><label>Cargo envío ($)</label><input type="number" inputmode="numeric" id="v-env" value="${venta.envio||''}" placeholder="0" oninput="venta.envio=+this.value||0;drawTotals()"></div>
      </div>
      ${isCard()?'<p style="font-size:12px;color:var(--muted);margin:-4px 0 12px">💳 Precio con recargo de tarjeta. Al registrar se genera el link de pago Nave para enviar al cliente.</p>':''}
      <div id="v-totals"></div>
      <button class="btn" style="margin-top:14px" id="v-submit" onclick="registrarPedido()">${isCard()?"Registrar y generar link":"Registrar pedido"}</button>
    </div>`;
  drawTotals();
}
function drawTotals(){
  const t=$("#v-totals"); if(!t) return;
  t.innerHTML=`
    <div class="tot-line"><span>Subtotal${isCard()?' (tarjeta)':''}</span><span>${fmt(cartSubtotal())}</span></div>
    ${venta.descuento?`<div class="tot-line disc"><span>Descuento</span><span>−${fmt(venta.descuento)}</span></div>`:""}
    ${venta.envio?`<div class="tot-line"><span>Envío</span><span>${fmt(venta.envio)}</span></div>`:""}
    <div class="tot-line big"><span>Total</span><span>${fmt(cartTotal())}</span></div>`;
  updateCartBar();
}
async function registrarPedido(){
  if(!cart.length) return toast("Agregá prendas primero",true);
  if(!venta.cliente) return toast("Elegí un cliente",true);
  const card=isCard();
  const btn=$("#v-submit"); btn.disabled=true; btn.textContent=card?"Generando…":"Registrando…";
  try{
    const total=cartTotal();
    const r = await api("pedido",{method:"POST",body:{
      codigoCliente: venta.cliente.codigo, colegio: venta.cliente.colegio||"WS",
      formaPago: venta.pago, items: cart.map(i=>({nombre:i.nombre,talle:i.talle,qty:i.qty})),
    }});
    let naveUrl="";
    if(card){
      try{
        const nr=await fetch("/api/nave/create-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
          orderId:r.idPedido, total, nombreCliente:(venta.cliente.nombre+" "+(venta.cliente.apellido||"")).trim(),
          email:venta.cliente.email||"", telefono:venta.cliente.telefono||"",
          items:cart.map(i=>({nombre:i.nombre,talle:i.talle,qty:i.qty,precio:unitPrice(i)})),
        })});
        const nd=await nr.json();
        if(nr.ok && nd.checkout_url) naveUrl=nd.checkout_url;
        else throw new Error(nd.error||"No se pudo generar el link");
      }catch(ne){ toast("Pedido guardado, pero el link falló: "+ne.message, true); }
    }
    const resumen=buildResumen(r.idPedido,total,naveUrl);
    const waTel=venta.cliente.telefono||"";
    const waLabel=waTel?"Enviar al WhatsApp del cliente":"Enviar por WhatsApp";
    $("#view").innerHTML=`
      <div class="card" style="text-align:center;padding:28px 20px">
        <div style="font-size:44px">✅</div>
        <h2 style="margin:8px 0 2px">Pedido ${esc(r.idPedido)}</h2>
        <p style="color:var(--muted);margin:0 0 4px">${esc((venta.cliente.nombre+" "+(venta.cliente.apellido||"")).trim())}</p>
        <div style="font-size:26px;font-weight:800;margin:10px 0">${fmt(total)}</div>
        ${naveUrl?`<div class="field" style="text-align:left;margin-top:8px"><label>Link de pago (Nave)</label><input id="nave-url" readonly value="${esc(naveUrl)}" onclick="this.select()"></div>
          <button class="btn" onclick='copyText(${JSON.stringify(naveUrl)},"Link copiado")'>Copiar link de pago</button>`:''}
        <button class="btn gold" style="margin-top:10px" onclick='waResumen(${JSON.stringify(resumen)},${JSON.stringify(waTel)})'>${waLabel}</button>
        <button class="btn ghost" style="margin-top:10px" onclick="nuevoPedido()">Nuevo pedido</button>
      </div>`;
    cart=[]; venta={cliente:null,descuento:0,envio:0,pago:"Transf. Banc."};
    DATA.pedidos=null; DATA.dashboard=null; DATA.stock=null; DATA.ordenes=null;
    updateCartBar();
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent=card?"Registrar y generar link":"Registrar pedido"; }
}
function buildResumen(id,total,naveUrl){
  const items = cart.map(i=>`• ${i.nombre} T${i.talle} x${i.qty} — ${fmt(unitPrice(i)*i.qty)}`).join("\n");
  let s=`*Pedido #${id}* — NORD Uniformes\nCliente: ${venta.cliente.nombre} ${venta.cliente.apellido||""}\n\n${items}\n`;
  if(venta.descuento) s+=`Descuento: −${fmt(venta.descuento)}\n`;
  if(venta.envio) s+=`Envío: ${fmt(venta.envio)}\n`;
  s+=`\n*Total: ${fmt(total)}*\nForma de pago: ${venta.pago}`;
  if(naveUrl) s+=`\n\n💳 Pagá con tarjeta acá: ${naveUrl}`;
  return s;
}
function copyText(txt,msg){ navigator.clipboard?.writeText(txt).then(()=>toast(msg||"Copiado")).catch(()=>{}); }
function waNumber(tel){
  const d=String(tel||"").replace(/\D/g,"");
  if(!d) return "";
  return d.startsWith("54") ? d : "549"+d.replace(/^0/,"");
}
function waResumen(txt,tel){
  copyText(txt,"Resumen copiado");
  const num=waNumber(tel);
  window.open(`https://wa.me/${num}?text=`+encodeURIComponent(txt),"_blank");
}

    v.innerHTML=`
      <div class="seg">
        <button class="${f==='todos'?'on':''}" onclick="window._pedFilter='todos';render()">Todos</button>
        <button class="${f==='debe'?'on':''}" onclick="window._pedFilter='debe';render()">Deben</button>
        <button class="${f==='entregar'?'on':''}" onclick="window._pedFilter='entregar';render()">A entregar</button>
      </div>
      ${list.length?list.map(p=>`
        <div class="card" style="margin-bottom:10px;cursor:pointer" onclick='openPedido(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
          <div class="row" style="padding:0 0 8px"><div class="grow">
            <div class="name">${esc(p.id)} · ${esc(p.cliente)}</div>
            <div class="meta">${esc(p.fecha||"")} · ${p.cant} prenda${p.cant!==1?'s':''} · Total ${fmt(p.totalVenta||p.monto)}</div>
          </div><span style="color:var(--dorado);font-size:20px">›</span></div>
          <div style="display:flex;gap:8px">
            <span class="chip ${p.saldo>0.5?'r':'g'}">${p.saldo>0.5?"Debe "+fmt(p.saldo):"Pagado"}</span>
            <span class="chip ${isEnt(p.estadoEnvio)?'g':'a'}">${esc(p.estadoEnvio||"Sin entregar")}</span>
          </div>
        </div>`).join(""):'<div class="empty">No hay pedidos acá</div>'}`;
  }catch(e){ errBox(v,e); }
}
function openPedido(p){
  const opts=["Pendiente","En Preparación","Preparado","Entregado"];
  if(p.estadoEnvio && !opts.includes(p.estadoEnvio)) opts.unshift(p.estadoEnvio);
  const envs=["Retiro Habitat","Envío a domicilio"];
  if(p.envio && !envs.includes(p.envio)) envs.unshift(p.envio);
  const pj=JSON.stringify({id:p.id}).replace(/'/g,"&#39;");
  openSheet(`<div class="grabber"></div><h3>${esc(p.id)}</h3><p class="sub">${esc(p.cliente)}${p.fecha?" · "+esc(p.fecha):""}</p>
    <div class="tot-line"><span>Total venta</span><span>${fmt(p.totalVenta||p.monto)}</span></div>
    <div class="tot-line"><span>Pagado</span><span>${fmt(p.montoPago)}</span></div>
    <div class="tot-line big"><span>Saldo</span><span style="color:${p.saldo>0.5?'var(--red)':'var(--green)'}">${fmt(p.saldo)}</span></div>

    <div class="section-h" style="margin:20px 2px 8px">💵 Registrar pago</div>
    <div class="field"><label>Monto que recibís ($)</label><input type="number" inputmode="numeric" id="pg-monto" value="${Math.max(0,Math.round(p.saldo))||''}"></div>
    <div class="two">
      <div class="field"><label>Fecha</label><input id="pg-fecha" value="${todayAR()}"></div>
      <div class="field"><label>Forma de pago</label><select id="pg-forma"><option>Transf. Banc.</option><option>Efectivo</option><option>Tarjeta (Nave)</option></select></div>
    </div>
    <button class="btn" id="pg-save" onclick='savePago(${pj})'>Registrar pago</button>

    <div class="section-h" style="margin:24px 2px 8px">🚚 Registrar entrega</div>
    <div class="two">
      <div class="field"><label>Estado</label><select id="en-est">${opts.map(o=>`<option ${p.estadoEnvio===o?"selected":""}>${o}</option>`).join("")}</select></div>
      <div class="field"><label>Método</label><select id="en-env">${envs.map(o=>`<option ${p.envio===o?"selected":""}>${o}</option>`).join("")}</select></div>
    </div>
    <button class="btn ghost" id="en-save" onclick='saveEntrega(${pj})'>Guardar entrega</button>`);
}
async function savePago(p){
  const monto=+$("#pg-monto").value; if(!monto||monto<=0) return toast("Ingresá el monto",true);
  const btn=$("#pg-save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    await api("pago",{method:"POST",body:{idPedido:p.id, montoPago:monto, fechaPago:$("#pg-fecha").value.trim(), formaPago:$("#pg-forma").value}});
    closeSheet(); toast("Pago registrado"); DATA.pedidos=null; DATA.dashboard=null; render(true);
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="Registrar pago"; }
}
async function saveEntrega(p){
  const btn=$("#en-save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    await api("entrega",{method:"POST",body:{idPedido:p.id, estadoEnvio:$("#en-est").value, envio:$("#en-env").value}});
    closeSheet(); toast("Entrega actualizada"); DATA.pedidos=null; render(true);
  }catch(e){ toast(e.message,true); btn.disabled=false; btn.textContent="Guardar entrega"; }
}

// ─────────────────────────────────────────────────────────────── ÓRDENES (detalle)
async function viewOrdenes(v,force){
  try{
    if(force||!DATA.ordenes){ loading(v); DATA.ordenes = await api("ordenes"); }
    window._ordQ = window._ordQ||"";
    v.innerHTML=`
      <div class="search"><span class="mag">🔎</span><input id="ord-q" placeholder="Buscar pedido, cliente o prenda…" value="${esc(window._ordQ)}"></div>
      <div id="ord-list"></div>`;
    const inp=$("#ord-q");
    const draw=()=>{
      const q=inp.value.trim().toLowerCase(); window._ordQ=inp.value;
      const list=DATA.ordenes.filter(o=> !q || (`${o.id} ${o.cliente} ${o.items.map(i=>i.nombre).join(" ")}`).toLowerCase().includes(q));
      $("#ord-list").innerHTML = list.length?list.map(o=>`
        <div class="card" style="margin-bottom:10px">
          <div class="row" style="padding:0 0 8px">
            <div class="grow"><div class="name">${esc(o.id)} · ${esc(o.cliente)}</div>
              <div class="meta">${esc(o.fecha||"")} · ${esc(o.formaPago||"")}</div></div>
            <span class="chip n">${fmt(o.total)}</span>
          </div>
          ${o.items.map(i=>`<div class="row" style="padding:7px 0">
            <div class="grow"><div class="name" style="font-size:13.5px">${esc(i.nombre)} · T${esc(i.talle)}</div>
              <div class="meta">×${i.qty} · ${fmt(i.precio)} c/u${i.ganancia?` · ganancia ${fmt(i.ganancia)}`:''}</div></div>
            <span style="font-weight:700">${fmt(i.precioTotal)}</span></div>`).join("")}
        </div>`).join(""):'<div class="empty">Sin resultados</div>';
    };
    inp.oninput=draw; draw();
  }catch(e){ errBox(v,e); }
}

// ─────────────────────────────────────────────────────────────── SHEET
function openSheet(html){ $("#sheet").innerHTML=html; $("#sheet-bg").classList.add("open"); sheetOpen=true; updateBack(); }
function closeSheet(){ $("#sheet-bg").classList.remove("open"); sheetOpen=false; updateBack(); }

// ─────────────────────────────────────────────────────────────── INIT
// Botón físico de atrás del celu / gesto de retroceso
window.addEventListener("popstate",()=>{
  if(sheetOpen){ closeSheet(); history.pushState({tab:TAB},""); return; }  // cierra el panel, no sale
  if(navStack.length){ go(navStack.pop(), {push:false}); }                 // vuelve a la pantalla anterior
});
if(TOKEN) showApp(); else { $("#login").style.display="flex"; }
$("#pwd").addEventListener("keydown",e=>{ if(e.key==="Enter")login(); });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw-erp.js",{scope:"/erp"}).catch(()=>{}); }
</script>
</body>
