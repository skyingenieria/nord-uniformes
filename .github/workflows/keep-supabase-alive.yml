name: Keep Supabase alive

# Supabase pausa los proyectos del plan Free con poca actividad en 7 días
# seguidos -- pero, según la doc oficial (supabase.com/docs/guides/platform/
# free-project-pausing), lo que cuenta es "a few user requests... each day
# over the previous week": quiere señal TODOS los días, no alcanza con
# pasar cada pocos días por debajo del umbral de 7. Con el cron viejo
# (lunes y jueves, cada 3-4 días) el proyecto se pausó igual el 2026-11-16
# -- este workflow corre una vez por día para no volver a caer en eso.
#
# Usa la misma anon key pública que ya está hardcodeada en wellspring.html/
# carrito.html/gestion.html (no es secreta, protegida por RLS del lado de
# Supabase -- ver CLAUDE.md, sección Supabase) y sólo hace un SELECT de 1
# fila de 001_prendas (catálogo público), no escribe nada.

on:
  schedule:
    - cron: '0 12 * * *' # todos los días, 12:00 UTC
  workflow_dispatch: {} # para poder probarlo a mano desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://piaagjddrrcbijienvll.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_yd1wUT0mgOFUcqzbJl_9Cw_WZ8AX6Vp
        run: |
          http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/001_prendas?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $http_code"
          cat /tmp/resp.json
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Supabase respondió $http_code -- revisar si el proyecto está pausado o la anon key cambió"
            exit 1
          fi
