<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NORD | Carrito</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%230F172E'/><text x='16' y='14' dominant-baseline='central' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='20' fill='white'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul:#1E2D4A;--azul-900:#0F172E;--azul-600:#34466A;--azul-400:#6B7B9C;
      --dorado:#C8A96E;--dorado-700:#A6884B;--dorado-300:#E0CBA0;
      --niebla:#8A9AB5;--niebla-200:#D3DAE5;
      --crema:#F4F1EA;--crema-2:#ECE7DC;--blanco:#FFFFFF;
      --sans:"Mulish",system-ui,sans-serif;--serif:"Cormorant Garamond",serif;
      --pad-x:clamp(20px,5vw,80px);--max:1200px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--crema);color:var(--azul-900);line-height:1.55;-webkit-font-smoothing:antialiased}
    a{text-decoration:none}

    header{background:rgba(244,241,234,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(30,45,74,.08);position:sticky;top:0;z-index:100}
    .header-container{max-width:var(--max);margin:0 auto;padding:0 var(--pad-x);height:64px;display:flex;justify-content:space-between;align-items:center}
    .brand-logo .nord{font-weight:900;font-size:22px;letter-spacing:.06em;display:block;color:var(--azul-900)}
    .brand-logo .uniformes{font-weight:300;font-size:6px;letter-spacing:.55em;display:block;margin-top:2px;padding-left:.55em;color:var(--azul-900)}
    .back-link{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--azul-400);display:flex;align-items:center;gap:6px;transition:color .2s}
    .back-link:hover{color:var(--azul-900)}

    .page{max-width:var(--max);margin:0 auto;padding:48px var(--pad-x) 80px}
    .page-title{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.02em;margin-bottom:8px;display:flex;align-items:center;gap:12px}
    .page-subtitle{font-size:12px;color:var(--azul-400);margin-bottom:40px}
    .checkout-grid{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start}

    .left{display:flex;flex-direction:column;gap:28px}

    .section-block{background:var(--blanco);border:1px solid var(--niebla-200);padding:24px 28px;border-radius:14px;box-shadow:0 2px 12px rgba(30,45,74,.06);transition:box-shadow .3s}
    .section-block:hover{box-shadow:0 4px 20px rgba(30,45,74,.1)}
    .section-block-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--azul-400);margin-bottom:18px}

    .cart-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--niebla-200);gap:14px}
    .cart-item:first-child{border-top:1px solid var(--niebla-200)}
    .item-info{flex:1}
    .item-name{font-size:14px;font-weight:700}
    .item-talle{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--azul-400);margin-top:2px}
    .qty-wrap{display:flex;align-items:center;gap:10px}
    .qty-btn{width:27px;height:27px;border:1px solid var(--niebla-200);background:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--azul);transition:all .15s;border-radius:6px}
    .qty-btn:hover{background:var(--azul-900);color:var(--crema);border-color:var(--azul-900)}
    .qty-num{font-size:14px;font-weight:700;min-width:18px;text-align:center}
    .item-price{font-size:15px;font-weight:700;white-space:nowrap}
    .item-remove{background:none;border:none;cursor:pointer;color:var(--niebla);padding:4px;display:flex;transition:color .15s}
    .item-remove:hover{color:#c0392b}

    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-row.full{grid-template-columns:1fr}
    .form-group label{display:block;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--azul-400);margin-bottom:6px}
    .form-group input{width:100%;border:1px solid var(--niebla-200);background:var(--crema);padding:11px 13px;font-family:var(--sans);font-size:14px;color:var(--azul-900);outline:none;transition:border-color .15s, box-shadow .15s;border-radius:8px}
    .form-group input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(200,169,110,.1)}
    .form-group input::placeholder{color:#b0bac9}

    /* ── Selector de método de pago ── */
    .pago-options{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .pago-option{border:2px solid var(--niebla-200);padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s,box-shadow .15s;border-radius:12px}
    .pago-option:hover{border-color:var(--azul-400);box-shadow:0 2px 8px rgba(30,45,74,.08)}
    .pago-option.selected{border-color:var(--azul-900);background:#f0f2f6;box-shadow:0 2px 8px rgba(30,45,74,.12)}
    .pago-option input[type=radio]{accent-color:var(--azul-900);width:16px;height:16px;flex-shrink:0}
    .pago-option-label{flex:1}
    .pago-option-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
    .pago-option-desc{font-size:12px;color:var(--azul-400);margin-top:3px}
    .nave-logo{font-size:13px;font-weight:900;letter-spacing:-.02em;color:#6d28d9}
    .badge-new{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:#ede9fe;color:#6d28d9}

    .summary-panel{background:var(--blanco);border:1px solid var(--niebla-200);padding:28px;position:sticky;top:80px;border-radius:14px;box-shadow:0 2px 12px rgba(30,45,74,.06)}
    .summary-title{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--azul-400);margin-bottom:20px}
    .sum-row{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;color:var(--azul-600)}
    .sum-row.total{border-top:1px solid var(--niebla-200);margin-top:8px;padding-top:16px;font-size:20px;font-weight:800;color:var(--azul-900)}

    .req{color:#c0392b;margin-left:2px}
    .field-error{border-color:#c0392b !important}

    .btn-pagar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;background:var(--azul-900);color:#fff;border:none;padding:15px;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s;border-radius:10px}
    .btn-pagar:hover:not(:disabled){background:var(--azul)}
    .btn-pagar:disabled{opacity:.7;cursor:not-allowed}
    .btn-pagar.nave-btn{background:#6d28d9}
    .btn-pagar.nave-btn:hover:not(:disabled){background:#5b21b6}
    .btn-wp{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;background:#25D366;color:#fff;border:none;padding:15px;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s;text-decoration:none;border-radius:10px}
    .btn-wp:hover{background:#1ebe5d}
    .note{margin-top:12px;font-size:11px;color:var(--azul-400);text-align:center;line-height:1.5}

    /* Datos transferencia */
    .datos-pago{display:none;background:var(--crema);border:1px solid var(--niebla-200);border-radius:10px;padding:18px;margin-top:16px}
    .datos-pago.visible{display:block}
    .dato-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--niebla-200);font-size:13px}
    .dato-row:last-child{border-bottom:none}
    .dato-label{color:var(--azul-400);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
    .dato-val{font-weight:700;font-size:14px;color:var(--azul-900)}
    .btn-copy{background:none;border:1px solid var(--niebla-200);border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--azul-600);transition:all .2s}
    .btn-copy:hover{background:var(--azul-900);color:white;border-color:var(--azul-900)}

    /* Nave loading indicator (mientras carga el modal) */
    .nave-loading{display:none;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:12px;color:#6d28d9;font-weight:700}
    .nave-loading.visible{display:flex}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid #c4b5fd;border-top-color:#6d28d9;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Panel éxito Nave */
    .nave-ok{display:none;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:20px;margin-top:16px;text-align:center}
    .nave-ok.visible{display:block}
    .nave-ok-icon{font-size:36px;margin-bottom:8px}
    .nave-ok h3{font-size:16px;font-weight:800;color:#166534;margin-bottom:6px}
    .nave-ok p{font-size:13px;color:#166534;line-height:1.5}

    .accordion{margin-top:10px;border:1px solid var(--niebla-200);border-radius:10px;overflow:hidden}
    .accordion-item{border-bottom:1px solid var(--niebla-200)}
    .accordion-item:last-child{border-bottom:none}
    .accordion-btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--azul-900);text-align:left;transition:background .15s}
    .accordion-btn:hover{background:var(--crema-2)}
    .accordion-btn svg{flex-shrink:0;transition:transform .2s;color:var(--azul-400)}
    .accordion-item.open .accordion-btn svg{transform:rotate(180deg)}
    .accordion-body{display:none;padding:0 16px 14px;font-size:13px;color:var(--azul-600);line-height:1.6}
    .accordion-item.open .accordion-body{display:block}
    .accordion-body p{margin-bottom:8px}
    .accordion-body p:last-child{margin-bottom:0}
    .accordion-body strong{color:var(--azul-900);font-weight:700}
    .retiro-link{color:var(--azul-900);font-weight:700;text-decoration:underline}

    .cart-empty{text-align:center;padding:80px 0;grid-column:1/-1}
    .cart-empty p{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--azul-400);margin-bottom:24px}
    .btn-outline{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--azul);color:var(--azul);padding:12px 28px;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:all .2s;border-radius:10px}
    .btn-outline:hover{background:var(--azul-900);color:var(--crema);border-color:var(--azul-900);box-shadow:0 4px 12px rgba(15,23,46,.2)}

    /* Precio tachado (lista) + precio con descuento al lado */
    .price-strike{text-decoration:line-through;color:var(--azul-400);font-size:12px;margin-right:6px;font-weight:600}
    .price-now.promo{color:#2e7d52}
    .promo-tag{color:#2e7d52;font-weight:800;font-size:11px;letter-spacing:.02em}

    /* Tarjeta de oferta — más llamativa, mismos colores de marca */
    .promo-card{position:relative;border:1.5px solid var(--dorado);background:linear-gradient(135deg,#fffaf0,#fdf2dc);overflow:hidden}
    .promo-card::before{content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(180deg,var(--dorado),var(--dorado-700))}
    .promo-badge{position:absolute;top:18px;right:18px;background:var(--azul-900);color:#fff;font-weight:900;font-size:13px;padding:6px 13px;border-radius:999px;letter-spacing:.01em;box-shadow:0 3px 10px rgba(15,23,46,.25)}
    .promo-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dorado-700);margin-bottom:8px}
    .promo-title{font-size:17px;font-weight:800;margin-bottom:5px;padding-right:76px;letter-spacing:-.01em}
    .promo-sub{font-size:12.5px;color:var(--azul-600);margin-bottom:16px;line-height:1.5}
    .promo-actions{display:flex;gap:10px;flex-wrap:wrap}
    .promo-select{flex:1;min-width:120px;border:1px solid var(--niebla-200);background:#fff;padding:11px 13px;border-radius:8px;font-family:var(--sans);font-size:14px;color:var(--azul-900)}
    .promo-btn{background:var(--azul-900);color:#fff;border-color:var(--azul-900);flex:0 0 auto}
    .promo-btn:hover{background:var(--azul);color:#fff;border-color:var(--azul)}

    .ahorro-row{color:#2e7d52;font-weight:700;background:#eaf6ef;padding:9px 11px;border-radius:8px;margin:4px 0}

    @media(max-width:900px){
      .checkout-grid{grid-template-columns:1fr}
      .summary-panel{position:static}
      .form-row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <a href="/" class="brand-logo">
      <span class="nord">NORD</span>
      <span class="uniformes">UNIFORMES</span>
    </a>
    <a href="/wellspring" class="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Seguir comprando
    </a>
  </div>
</header>

<div class="page">
  <h1 class="page-title">Tu carrito</h1>
  <div class="checkout-grid" id="checkout-grid">
    <div class="cart-empty">
      <p>Tu carrito está vacío</p>
      <a href="/wellspring" class="btn-outline">Ver catálogo</a>
    </div>
  </div>
</div>


<script>
function getCart() {
  try { return JSON.parse(localStorage.getItem("nord_cart") || "[]"); } catch { return []; }
}
function saveCart(c) { localStorage.setItem("nord_cart", JSON.stringify(c)); }
function fmt(n) { return "$" + Number(n).toLocaleString("es-AR"); }
// Precio de lista (con tarjeta): valor real de la hoja (col F); si falta, transferencia + 15%.
function listaDe(precio, precioLista) { return (precioLista && precioLista > 0) ? Math.round(precioLista) : Math.round((Number(precio) || 0) * 1.15); }

// ── Promo "Chomba Blanca" 30% off ────────────────────────────────────────
// Con cualquier otra prenda que no sea medias, se puede sumar una Chomba
// Blanca (el talle que quieras) con 30% de descuento sobre el precio de
// LISTA — siempre sobre lista, sea cual sea el método de pago — y hasta 1
// unidad en total por pedido (si ya hay una, se puede sumar otra pero va a
// precio de lista). La misma regla se re-valida server-side en
// api/orders.js al crear el pedido, así que esto de acá es sólo para
// mostrar el precio correcto en pantalla y cobrar bien vía Nave.
const SB_URL = "https://piaagjddrrcbijienvll.supabase.co";
const SB_ANON_KEY = "sb_publishable_yd1wUT0mgOFUcqzbJl_9Cw_WZ8AX6Vp";
const PROMO_NOMBRE = "Chomba Blanca";
const PROMO_PCT = 30;
let _sbClient = null;
function waitForSupabaseLib() {
  return new Promise(resolve => {
    if (window.supabase) return resolve();
    const iv = setInterval(() => { if (window.supabase) { clearInterval(iv); resolve(); } }, 20);
  });
}
async function getSb() {
  await waitForSupabaseLib();
  if (!_sbClient) _sbClient = window.supabase.createClient(SB_URL, SB_ANON_KEY);
  return _sbClient;
}
let _chombaTalles = null; // null = todavía no cargó / no se pudo cargar
const TALLE_ORDER = ['XS','S','M','L','XL','XXL','XXXL'];
function talleSort(a, b) {
  const na = Number(a.talle), nb = Number(b.talle);
  const aNum = !isNaN(na) && String(a.talle).trim() !== "", bNum = !isNaN(nb) && String(b.talle).trim() !== "";
  if (aNum && bNum) return na - nb;
  if (aNum) return -1;
  if (bNum) return 1;
  const ai = TALLE_ORDER.indexOf(String(a.talle).toUpperCase()), bi = TALLE_ORDER.indexOf(String(b.talle).toUpperCase());
  if (ai !== -1 && bi !== -1) return ai - bi;
  return String(a.talle).localeCompare(String(b.talle));
}
async function loadChombaPromo() {
  try {
    const c = await getSb();
    const { data: prenda } = await c.from("001_prendas").select("id").eq("nombre", PROMO_NOMBRE).maybeSingle();
    if (!prenda) return;
    const [{ data: talles }, { data: precios }] = await Promise.all([
      c.from("002_talles").select("id,talle").eq("product_id", prenda.id),
      c.from("102_precio_vigente").select("talle_id,precio_lista,precio_transferencia"),
    ]);
    const precioMap = Object.fromEntries((precios || []).map(p => [p.talle_id, p]));
    _chombaTalles = (talles || []).map(t => {
      const pr = precioMap[t.id] || {};
      return { talle: t.talle, precio: Number(pr.precio_transferencia) || 0, precioLista: Number(pr.precio_lista) || 0 };
    }).sort(talleSort);
  } catch (e) { console.error("No se pudo cargar la promo Chomba Blanca:", e); }
}
function cartHasQualifyingItem(cart) { return cart.some(i => i.nombre !== PROMO_NOMBRE && !/^medias?\b/i.test(i.nombre || "")); }
function cartHasPromoItem(cart) { return cart.some(i => i.nombre === PROMO_NOMBRE); }
// Cuántas unidades de cada línea llevan el 30% — como mucho 1 EN TOTAL entre
// todas las líneas de "Chomba Blanca" del carrito (si hay dos talles
// distintos, sólo la primera unidad de la primera línea lo lleva).
function chombaDiscountFlags(cart) {
  const flags = new Array(cart.length).fill(0);
  if (!cartHasQualifyingItem(cart)) return flags;
  let remaining = 1;
  cart.forEach((i, idx) => {
    if (i.nombre !== PROMO_NOMBRE || remaining <= 0) return;
    const used = Math.min(i.qty, remaining);
    flags[idx] = used;
    remaining -= used;
  });
  return flags;
}
// Precio de lista SIN ningún descuento — es lo que se muestra tachado.
function itemListaOriginal(i) { return listaDe(i.precio, i.precioLista); }
// Precio efectivo por unidad de una línea para el método de pago dado.
// El 30% de la promo se calcula siempre sobre precio de lista y reemplaza
// (no se suma a) el descuento normal por transferencia en esa línea.
function itemPrecioEfectivo(i, idx, cart, metodo, flags) {
  const lista = itemListaOriginal(i);
  const promoQty = flags[idx] || 0;
  const normal = metodo === "nave" ? lista : (Number(i.precio) || 0);
  if (promoQty <= 0) return normal;
  const conPromo = Math.round(lista * (1 - PROMO_PCT / 100));
  return Math.round((conPromo * promoQty + normal * (i.qty - promoQty)) / i.qty);
}
function computeTotals(cart, metodo, flags) {
  const totalLista = cart.reduce((s, i) => s + itemListaOriginal(i) * i.qty, 0);
  const totalEfectivo = cart.reduce((s, i, idx) => s + itemPrecioEfectivo(i, idx, cart, metodo, flags) * i.qty, 0);
  return { totalLista, totalEfectivo, ahorro: totalLista - totalEfectivo };
}
function priceHtmlFor(i, idx, cart, metodo, flags) {
  const lista = itemListaOriginal(i);
  const efectivo = itemPrecioEfectivo(i, idx, cart, metodo, flags);
  const isPromoLine = (flags[idx] || 0) > 0;
  if (efectivo >= lista) return fmt(lista * i.qty);
  return `<span class="price-strike">${fmt(lista * i.qty)}</span><span class="price-now${isPromoLine ? " promo" : ""}">${fmt(efectivo * i.qty)}</span>`;
}
function buildItemsHtml(cart, metodo, flags) {
  return cart.map((i, idx) => {
    const isPromoLine = (flags[idx] || 0) > 0;
    return `
    <div class="cart-item">
      <div class="item-info">
        <p class="item-name">${i.nombre}${isPromoLine ? ' <span class="promo-tag">· 30% OFF</span>' : ''}</p>
        <p class="item-talle">Talle ${i.talle}</p>
      </div>
      <div class="qty-wrap">
        <button class="qty-btn" onclick="changeQty('${i.key}',-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty('${i.key}',1)">+</button>
      </div>
      <div class="item-price">${priceHtmlFor(i, idx, cart, metodo, flags)}</div>
      <button class="item-remove" onclick="removeItem('${i.key}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  }).join("");
}
function buildSummaryLines(cart, metodo, flags) {
  return cart.map((i, idx) => `<div class="sum-row"><span>${i.nombre} x${i.qty}</span><span>${priceHtmlFor(i, idx, cart, metodo, flags)}</span></div>`).join("");
}
function agregarChombaPromo() {
  if (_orderCompleted) return;
  const sel = document.getElementById("promo-talle");
  const talle = sel?.value;
  const t = (_chombaTalles || []).find(x => String(x.talle) === talle);
  if (!t) return;
  const cart = getCart();
  const key = "chomba-blanca-promo-" + talle;
  const existing = cart.find(i => i.key === key);
  if (existing) existing.qty += 1;
  else cart.push({ key, nombre: PROMO_NOMBRE, talle: t.talle, qty: 1, precio: t.precio, precioLista: t.precioLista });
  saveCart(cart);
  render();
}

function changeQty(key, d) {
  if (_orderCompleted) return;
  const cart = getCart();
  const item = cart.find(i => i.key === key);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) cart.splice(cart.indexOf(item), 1);
  saveCart(cart); render();
}
function removeItem(key) { if (_orderCompleted) return; saveCart(getCart().filter(i => i.key !== key)); render(); }

function getMetodoPago() {
  const r = document.querySelector('input[name="metodo-pago"]:checked');
  return r ? r.value : "transferencia";
}

function validate() {
  const fields = ["inp-nombre","inp-apellido","inp-tel","inp-email"];
  let ok = true;
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (!el.value.trim()) { el.classList.add("field-error"); ok = false; }
    else el.classList.remove("field-error");
  });
  if (!ok) { document.getElementById("inp-nombre")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  return ok;
}

function onMetodoPagoChange() {
  const metodo = getMetodoPago();

  if (metodo === "nave") {

    btn.classList.add("nave-btn");

    btn.textContent = "IR A PAGAR";
    btn.classList.remove("nave-btn");

  // Los precios por línea (tachado lista + precio con descuento) dependen del
  // método elegido, así que hay que re-pintar ítems y resumen — pero sin
  // tocar innerHTML de "Tus datos" para no perder lo que la persona ya tipeó.
  const cart = getCart();
  const flags = chombaDiscountFlags(cart);
  const { totalEfectivo, ahorro } = computeTotals(cart, metodo, flags);
  const itemsList = document.getElementById("cart-items-list");
  if (itemsList) itemsList.innerHTML = buildItemsHtml(cart, metodo, flags);
  const summaryLines = document.getElementById("summary-lines");
  if (summaryLines) summaryLines.innerHTML = buildSummaryLines(cart, metodo, flags);
  const ahorroRow = document.getElementById("ahorro-row");
  const ahorroVal = document.getElementById("ahorro-val");
  const totalDisplay = document.getElementById("total-display");
  if (ahorroRow && totalDisplay) {
    ahorroRow.style.display = ahorro > 0.5 ? "" : "none";
    if (ahorroVal) ahorroVal.textContent = fmt(ahorro);
    totalDisplay.textContent = fmt(totalEfectivo);
  }
  // Pre-calentar token de Nave para reducir latencia al pagar
  if (metodo === "nave") fetch("/api/nave/warmup").catch(() => {});
  // Ocultar paneles de resultado si el usuario cambia de método
  ["datos-pago","nave-loading","nave-ok"].forEach(id => {

// ── IR A PAGAR ────────────────────────────────────────────────────────────
// Cliente + orden se crean en Supabase (003_clientes/004_pedidos/005_ordenes)
// en vez de Sheets. El precio final lo recalcula el servidor contra
// 102_precio_vigente/103_costo_vigente — lo que viaja acá es sólo para mostrar
// el resumen en pantalla.
let _savedOrderId = null;
// Una vez que el pedido ya se guardó en Supabase (cualquier método de pago),
// se bloquea toda edición del carrito -- antes solo Nave vaciaba el carrito
// al confirmar; por transferencia el carrito seguía editable y "IR A PAGAR"
// seguía clickeable, así que volver a /carrito (back, refresh, doble tab)
// podía generar un segundo pedido real con el mismo contenido.
let _orderCompleted = false;

async function irAPagar() {
  if (_orderCompleted) return;
  if (!validate()) return;

  const metodo   = getMetodoPago();
  const nombre   = document.getElementById("inp-nombre").value.trim();
  const apellido = document.getElementById("inp-apellido").value.trim();
  const tel      = document.getElementById("inp-tel").value.trim();
  const email    = document.getElementById("inp-email").value.trim();
  const cart  = getCart();
  const flags = chombaDiscountFlags(cart);
  const { totalLista, totalEfectivo, ahorro } = computeTotals(cart, metodo, flags);
  const totalFinal = totalEfectivo;

  const btn = document.querySelector(".btn-pagar");
  btn.textContent = "Guardando pedido…";
  btn.disabled = true;

  try {
    // 1. Cliente en Supabase (003_clientes)
    const clienteRes = await fetch("/api/cliente/check-or-create", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ backend: "supabase", nombre, apellido, email, telefono: tel }),
    });
    const clienteData = await clienteRes.json();
    if (!clienteRes.ok || !clienteData.id) throw new Error(clienteData.error || "Error cliente");

    // 2. Guardar pedido + orden en Supabase (004_pedidos/005_ordenes). El "numero"
    // (YY-NN) se genera solo en el servidor, no hace falta pedirlo antes. El
    // descuento por transferencia y el de la promo ya están adentro de cada
    // precio_unitario (que el servidor recalcula de cero) — no se manda un
    // "descuento" de cabecera para no contarlo dos veces.
    const ordersRes = await fetch("/api/orders", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        backend: "supabase", clienteId: clienteData.id, items: cart,
        pago: metodo === "nave" ? "Tarjeta (Nave)" : "Transf. Banc.",
      }),
    });
    const pedido = await ordersRes.json();
    if (!ordersRes.ok) throw new Error(pedido.error || "Error guardando orden (" + ordersRes.status + ")");

    const idPedido = pedido.numero; // "YY-NN", para mostrar/WhatsApp/mail
    _savedOrderId  = idPedido;

    // 2b. Notificar el pedido por mail (a norduniformes@gmail.com + CC Flor), en cualquier método. No bloquea el flujo.
    fetch("/api/mail/send-order-notification", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        idPedido, codigoCliente: clienteData.codigo,
        nombre, apellido, email, telefono: tel, items: cart,
        subtotal: totalLista, descuento: ahorro, total: totalFinal,
        pago: metodo, envio: "retiro",
      }),
    }).catch(() => {});

    // 3. Guardar en session
    sessionStorage.setItem("nord_last_order", JSON.stringify({
      idPedido, nombre, apellido, items: cart, total: totalFinal,
    }));

    // 4. Flujo según método. A Nave le pasamos el uuid del pedido (pedido.id),
    // no el "numero" — así el webhook nunca lo confunde con un pedido de Sheets.
    if (metodo === "nave") {
      await pagarConNave({ idPedido: pedido.id, total: totalFinal, nombre, apellido, email, tel, cart, btn });
    } else {
      pagarConTransferencia({ totalFinal, idPedido, clienteData, nombre, apellido, email, cart, btn });
    }

  } catch (err) {
    btn.textContent = getMetodoPago() === "nave" ? "PAGAR CON TARJETA →" : "IR A PAGAR";
    btn.disabled = false;
    alert("Error: " + err.message);
  }
}

function pagarConTransferencia({ totalFinal, idPedido, clienteData, nombre, apellido, email, cart, btn }) {
  _orderCompleted = true;
  saveCart([]);
  document.getElementById("total-a-pagar").textContent = fmt(totalFinal);
  document.getElementById("datos-pago").classList.add("visible");
  btn.textContent = "✓ PEDIDO REGISTRADO";
  btn.style.background = "#2e7d52";
  btn.disabled = true;
  document.getElementById("datos-pago").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function pagarConNave({ idPedido, total, nombre, apellido, email, tel, cart, btn }) {
  btn.textContent = "Conectando con Nave…";
  // Abrir popup ANTES del fetch para que esté dentro del user-gesture (necesario en mobile)
  const w = 500, h = 700;
  const left = Math.round(screen.width / 2 - w / 2);
  const top  = Math.round(screen.height / 2 - h / 2);
  navePopup = window.open("about:blank", "nave-checkout",
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`);

  const naveRes = await fetch("/api/nave/create-payment", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      orderId: idPedido,
      total: total,
      nombreCliente: `${nombre} ${apellido}`,
      email,
      telefono: tel,
      items: cart,
    }),
  });

  const naveData = await naveRes.json();
  if (!naveRes.ok || !naveData.checkout_url) {
    cerrarModalNave(); // cerrar el popup en blanco si hubo error
    const detail = typeof naveData.details === "object"
      ? JSON.stringify(naveData.details)
      : (naveData.details || "");
    throw new Error((naveData.error || "Error Nave") + (detail ? "\n\nDetalle: " + detail : ""));
  }

  document.getElementById("nave-loading").classList.remove("visible");
  btn.textContent = "PAGAR CON TARJETA →";
  btn.disabled = false;

  // Navegar el popup ya abierto (abierto en el user-gesture para que mobile no lo bloquee)
  if (navePopup && !navePopup.closed) {
    navePopup.location.href = naveData.checkout_url;
    navePopup.focus();
  } else {
    window.location.href = naveData.checkout_url;
  }
}

function cerrarModalNave() {
  if (navePopup && !navePopup.closed) navePopup.close();
  navePopup = null;
}

function mostrarExitoNave() {
  _orderCompleted = true;
  const btn = document.querySelector(".btn-pagar");
  if (btn) { btn.textContent = "✓ PAGO CONFIRMADO"; btn.style.background = "#166534"; btn.disabled = true; }
  const ok = document.getElementById("nave-ok");
  if (ok) { ok.classList.add("visible"); ok.scrollIntoView({ behavior: "smooth", block: "start" }); }
  saveCart([]);
}

// Escuchar eventos del iframe de Nave
window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "PAYMENT_MODAL_RESPONSE") return;
  const d = e.data.data || {};
  if (d.success && !d.closeModal) {
    cerrarModalNave();
    mostrarExitoNave();
  } else if (d.closeModal) {
    cerrarModalNave();
  } else if (d.expiration) {
    cerrarModalNave();
    alert("La sesión de pago venció. Podés intentar de nuevo.");
  } else if (d.rejected) {
    cerrarModalNave();
    alert("El pago fue rechazado. Podés intentar con otra tarjeta.");
  }
});

function toggleAccordion(btn) {
  const item = btn.closest(".accordion-item");
  const isOpen = item.classList.contains("open");
  item.closest(".accordion").querySelectorAll(".accordion-item").forEach(i => i.classList.remove("open"));
  if (!isOpen) item.classList.add("open");
}

function copiar(texto, btn) {
  navigator.clipboard.writeText(texto).then(() => {
    const orig = btn.textContent;
    btn.textContent = "✓ Copiado";
    btn.style.background = "var(--azul-900)";
    btn.style.color = "white";
    setTimeout(() => { btn.textContent = orig; btn.style.background = ""; btn.style.color = ""; }, 1800);
  });
}

function enviarComprobante() {
  const cart = getCart();
  const flags = chombaDiscountFlags(cart);
  const sub = computeTotals(cart, "transferencia", flags).totalEfectivo;
  const nombre   = document.getElementById("inp-nombre")?.value.trim() || "";
  const apellido = document.getElementById("inp-apellido")?.value.trim() || "";
  const idPedido = _savedOrderId || "—";
  const items = cart.map((i, idx) => `• ${i.nombre} talle ${i.talle} x${i.qty}: ${fmt(itemPrecioEfectivo(i, idx, cart, "transferencia", flags) * i.qty)}`).join("\n");
  const msg = `Hola NORD Uniformes! Acá va mi comprobante de pago 🧾\n\n*Pedido #${idPedido}*\n*Familia: ${apellido} - ${nombre}*\n\n${items}\n\n*Total transferido: ${fmt(sub)}*\n\nAlias: nord.uniformes\n\n¡Gracias! 🙌`;
  window.open(`https://wa.me/5491135057838?text=${encodeURIComponent(msg)}`, "_blank");
}

render();
loadChombaPromo().then(() => render());
</script>
