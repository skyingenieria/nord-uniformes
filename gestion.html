<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NORD Gestión</title>
<meta name="theme-color" content="#0F172E">
<link rel="icon" href="/nord-icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="/qrcode.js" defer></script>
<script src="/factura.js" defer></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORD Gestión">
<style>
  :root{
    --azul-900:#0F172E; --azul:#1E2D4A; --azul-600:#34466A; --azul-400:#6B7B9C;
    --dorado:#C8A96E; --crema:#F4F1EA;
    --bg:#F4F1EA; --card:#ffffff; --ink:#0F172E; --muted:#6B7280; --line:#E6E1D6;
    --green:#1f9d5b; --green-bg:#e7f6ee; --red:#d64545; --red-bg:#fbeaea; --amber:#c98a1e; --amber-bg:#fbf3e2;
    --nav-h:64px; --shadow:0 2px 10px rgba(15,23,46,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}

  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 100% at 50% 0%, #1a2b4a 0%, #0F172E 70%)}
  .login-card{background:var(--card);border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
  .login-card img{width:76px;height:76px;border-radius:18px;margin-bottom:14px}
  .login-card h1{margin:0 0 4px;font-size:20px;letter-spacing:.02em}
  .login-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
  .login-card input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;outline:none;margin-bottom:12px;text-align:center}
  .login-card input:focus{border-color:var(--dorado)}
  .login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;
    padding:14px 18px;font-weight:700;font-size:15px;background:var(--azul-900);color:#fff;width:100%}
  .btn:active{transform:scale(.99)}
  .btn.gold{background:var(--dorado);color:var(--azul-900)}
  .btn.ghost{background:transparent;color:var(--azul-900);border:1.5px solid var(--line)}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto}
  .btn.red{background:var(--red)}
  .btn:disabled{opacity:.55}

  #app{display:none;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:20;background:var(--azul-900);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
  header .h-title{font-size:17px;font-weight:800;letter-spacing:.02em}
  header .h-sub{font-size:11px;color:var(--azul-400);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
  header .h-actions{display:flex;gap:8px}
  .icon-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:38px;height:38px;border-radius:11px;font-size:17px;display:grid;place-items:center}

  #view{padding:16px 16px 24px;max-width:640px;margin:0 auto}
  .view-title{font-size:22px;font-weight:800;margin:2px 0 14px}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -2px 14px rgba(15,23,46,.06)}
  nav button{position:relative;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding-top:8px;transition:color .15s}
  nav button .ic{font-size:20px;line-height:1;transition:transform .15s}
  nav button.active{color:var(--azul-900);font-weight:800}
  nav button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--dorado)}
  nav button.active .ic{transform:translateY(-2px) scale(1.12)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .card + .card{margin-top:12px}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .kpi .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi.hl{background:linear-gradient(135deg,#1a2b4a,#0F172E);color:#fff;border:none}
  .kpi.hl .lbl{color:var(--azul-400)} .kpi.hl .sub{color:#b9c4da}
  .kpi.gold{background:linear-gradient(135deg,#d8bd88,#C8A96E);border:none;color:var(--azul-900)}
  .kpi.gold .lbl{color:#6b551f}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-item{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .bar-item .bl{min-width:118px;max-width:118px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{flex:1;height:9px;background:#eef1f6;border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--azul-600),var(--azul-900));border-radius:999px}
  .bar-item .bv{min-width:74px;text-align:right;color:var(--muted);font-weight:700}
  .daily{display:flex;align-items:flex-end;gap:2px;height:84px;margin-top:4px}
  .daily .db{flex:1;background:var(--dorado);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
  .chart-cap{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px}
  .legend{display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px}

  .section-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 2px 10px}

  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:13px 14px 13px 40px;border:1.5px solid var(--line);border-radius:13px;outline:none;background:#fff}
  .search input:focus{border-color:var(--dorado)}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}

  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .grow{flex:1;min-width:0}
  .row .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:12.5px;color:var(--muted);margin-top:1px}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .chip.g{background:var(--green-bg);color:var(--green)} .chip.r{background:var(--red-bg);color:var(--red)} .chip.a{background:var(--amber-bg);color:var(--amber)}
  .chip.n{background:#eef1f6;color:var(--azul-600)}

  .talles{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .talle{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;min-width:58px;text-align:center;background:#fff}
  .talle .t{font-weight:800;font-size:14px}
  .talle .s{font-size:11px;margin-top:2px;font-weight:700}
  .talle.ok .s{color:var(--green)} .talle.low .s{color:var(--amber)} .talle.no{opacity:.5} .talle.no .s{color:var(--red)}

  .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#eef1f6;flex:0 0 auto}
  .thumb.ph{display:grid;place-items:center;font-size:22px}
  #cart-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);z-index:25;
    display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 12px;padding:13px 18px;border-radius:14px;
    background:var(--azul-900);color:#fff;box-shadow:0 6px 20px rgba(15,23,46,.3);font-weight:700;font-size:14px;cursor:pointer;max-width:616px}
  #cart-bar.show{display:flex}
  #cart-bar .cb-total{font-size:17px;font-weight:800}
  .sheet-foto{width:100%;max-height:320px;object-fit:contain;background:#eef1f6;border-radius:14px;margin-bottom:12px}
  .filters{margin-bottom:10px}
  .chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
  .chips-row::-webkit-scrollbar{display:none}
  .chips-row{scrollbar-width:none}
  .fchip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--azul-600);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
  .fchip.on{background:var(--azul-900);color:#fff;border-color:var(--azul-900)}

  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--azul-900);border-radius:50%;animation:spin .7s linear infinite;margin:36px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  .qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .qty button{width:34px;height:34px;border:none;background:#fff;font-size:18px;font-weight:700;color:var(--azul-900)}
  .qty span{min-width:30px;text-align:center;font-weight:800;font-size:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fff}
  .field input:focus,.field select:focus{border-color:var(--dorado)}
  .field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .field input[type=number]{-moz-appearance:textfield}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .margin-ok{color:var(--green)} .margin-low{color:var(--amber)} .margin-bad{color:var(--red)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .oi-row{display:grid;grid-template-columns:minmax(64px,1fr) 54px 74px 78px 58px 68px;align-items:center;
    column-gap:8px;row-gap:2px;padding:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .oi-row .oi-nombre{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .oi-row select.oi-talle{width:100%;padding:4px 4px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:700;background:#fff}
  .oi-row .qty{border-radius:8px}
  .oi-row .qty button{width:24px;height:24px;font-size:14px}
  .oi-row .qty span{min-width:22px;font-size:12px}
  .oi-row .oi-precio{font-size:11.5px;color:var(--azul-900);white-space:nowrap;text-align:right;line-height:1.3}
  .oi-row .oi-precio b{font-size:12.5px;font-weight:800}
  .oi-row .oi-lista{font-size:10px;color:var(--muted);font-weight:600}
  .oi-row .oi-desc-wrap{display:flex;align-items:center;gap:3px;justify-self:end}
  .oi-row .oi-desc-wrap input{width:38px;padding:6px 5px;border:1.5px solid var(--line);border-radius:8px;font-size:12px;text-align:center}
  .oi-row .oi-desc-wrap span{font-size:11px;color:var(--muted);font-weight:700}
  .oi-row .oi-subtotal{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap}
  .oi-row .oi-ro{font-size:12.5px;font-weight:700;color:var(--azul-900);background:#f4f1ea;border-radius:8px;padding:6px 9px;text-align:center;white-space:nowrap}
  .oi-row.editing{grid-template-columns:minmax(56px,1fr) 54px 74px 78px 58px 68px 24px}
  .oi-row .oi-del{border:none;background:transparent;color:#b23b3b;font-size:17px;font-weight:800;cursor:pointer;padding:2px 4px;line-height:1;justify-self:end}
  .oi-row .oi-del:active{opacity:.6}
  .oi-add{display:grid;grid-template-columns:minmax(0,1.4fr) 78px 58px auto;gap:8px;align-items:center;padding:12px 0 4px;border-top:1px dashed var(--line);margin-top:6px}
  .oi-add select,.oi-add input{padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;background:#fff}
  .oi-add input{text-align:center}
  .oi-add button{white-space:nowrap}
  .ga-add{grid-template-columns:100px 1.1fr 90px 1fr 1.2fr auto;border-top:none;padding-top:0}
  .ga-add input{text-align:left}
  .eg-add{grid-template-columns:100px 1fr 1fr 76px 90px 1.2fr auto;border-top:none;padding-top:0}
  .eg-add input{text-align:left}
  @media (max-width:480px){
    .oi-row{grid-template-columns:minmax(36px,1fr) 36px 54px 56px 38px 48px;column-gap:4px;padding:8px 0}
    .oi-row.editing{grid-template-columns:minmax(28px,1fr) 36px 54px 56px 38px 48px 20px}
    .oi-row .oi-nombre{font-size:10px}
    .oi-row .oi-lista{display:none}
    .oi-row .oi-precio{font-size:9.5px}
    .oi-row .oi-precio b{font-size:10.5px}
    .oi-row .qty button{width:18px;height:18px;font-size:11px}
    .oi-row .qty span{min-width:14px;font-size:10px}
    .oi-row select.oi-talle{font-size:10px;padding:3px 1px}
    .oi-row .oi-desc-wrap input{width:24px;padding:4px 2px;font-size:10px}
    .oi-row .oi-subtotal{font-size:11px}
    .oi-row .oi-ro{font-size:10px;padding:4px 4px}
    .oi-row .oi-del{font-size:15px}
    .oi-add{grid-template-columns:1fr;gap:6px}
    .ga-add{grid-template-columns:1fr}
    .eg-add{grid-template-columns:1fr}
  }
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:14px;border:1px solid var(--line)}
  table.pr-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  table.pr-table th{position:sticky;top:0;background:#fbf9f4;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);font-weight:800;padding:10px 12px;user-select:none;border-bottom:1.5px solid var(--line)}
  table.pr-table th[data-field]{cursor:pointer}
  table.pr-table th.sorted{color:var(--azul-900)}
  table.pr-table th .arrow{margin-left:4px;font-size:9px}
  table.pr-table td{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.pr-table tbody tr{cursor:pointer}
  table.pr-table tbody tr:last-child td{border-bottom:none}
  table.pr-table.static tbody tr{cursor:default}
  table.pr-table td select{padding:5px 7px;border:1.5px solid var(--line);border-radius:7px;font-size:12px;background:#fff;cursor:pointer}
  /* Anchos fijos (colgroup) para que los títulos nunca se desfacen de los datos,
     sin importar cuánto texto libre traiga una fila (proveedor/comentario/descripción).
     min-width en px (no sólo %) para que en mobile el navegador no aplaste las
     columnas por debajo de lo legible -- .table-wrap ya scrollea horizontal. */
  #ga-table{table-layout:fixed;min-width:620px}
  #eg-table{table-layout:fixed;min-width:860px}
  #ga-table td, #ga-table th, #eg-table td, #eg-table th{white-space:normal;word-break:break-word}
  #eg-table td select{width:100%;box-sizing:border-box}
  /* OJO: acá .pr-editable está puesto directo en el <td> (no en un <span> adentro,
     como en Compras/Precios) -- así que "display:inline-block" de la regla de
     abajo saca al <td> del layout de tabla y hace que las columnas se dibujen
     una encima de la otra. Tiene que seguir siendo table-cell, sólo sacándole
     el min-width fijo (que con columnas angostas era más ancho que la celda real
     y desbordaba sobre la vecina). */
  #ga-table .pr-editable, #eg-table .pr-editable{display:table-cell;min-width:0;white-space:normal;word-break:break-word}
  .pr-editable{cursor:pointer;display:inline-block;padding:3px 6px;border-radius:6px;border:1px solid transparent;min-width:70px;box-sizing:border-box}
  /* :hover sólo con mouse real -- en touch (mobile) el :hover queda "pegado" tras
     tocar y scrollear, mostrando cajas fantasma en celdas que no se tocaron. */
  @media (hover:hover){
    table.pr-table tbody tr:hover{background:#fbf9f4}
    table.pr-table.static tbody tr:hover{background:transparent}
    .pr-editable:hover{background:#fbf9f4;border-color:var(--line)}
  }
  .pr-editable input{width:100%;min-width:64px;padding:2px 5px;border:1.5px solid var(--dorado);border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;line-height:1.4}
  .tot-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
  .tot-line.big{font-size:19px;font-weight:800;border-top:1.5px solid var(--line);margin-top:6px;padding-top:12px}
  .tot-line .disc{color:var(--green)}

  .sheet-bg{position:fixed;inset:0;background:rgba(15,23,46,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(30px);transition:transform .22s}
  .sheet-bg.open .sheet{transform:translateY(0)}
  .sheet-bg.center{align-items:center;padding:20px}
  .sheet-bg.center .sheet{border-radius:18px;max-height:85vh}
  .sheet-bg.wide .sheet{max-width:880px}
  @media (min-width:900px){ .sheet-bg.wide.center .sheet{max-height:88vh} }
  .sheet h3{margin:0 0 3px;font-size:19px}
  .sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .grabber{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .sheet-topbar{position:sticky;top:0;height:0;z-index:5}
  .sheet-close{position:absolute;top:-6px;right:-4px;width:36px;height:36px;border:none;border-radius:50%;background:#eef1f6;color:var(--azul-900);font-size:17px;font-weight:700;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(15,23,46,.12)}

  /* Confirmación propia (reemplaza confirm() nativo) -- overlay aparte del
     sheet, así funciona igual si se dispara desde dentro de un sheet ya
     abierto (ej. borrar un ítem del detalle de un pedido) sin pisarlo. */
  .confirm-bg{position:fixed;inset:0;background:rgba(15,23,46,.55);z-index:95;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s;padding:20px}
  .confirm-bg.open{opacity:1;pointer-events:auto}
  .confirm-card{background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(15,23,46,.3);text-align:center}
  .confirm-msg{font-size:14.5px;line-height:1.5;color:var(--azul-900);margin:0 0 18px}
  .confirm-actions{display:flex;gap:10px}
  .confirm-actions .btn{flex:1;margin:0}
  .sheet-close:active{background:#e2e6ee}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);
    background:var(--azul-900);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}

  .seg{display:flex;background:#eef1f6;border-radius:12px;padding:4px;margin-bottom:14px}

<script>
// ─────────────────────────────────────────────────────────────── SUPABASE
const SUPABASE_URL = "https://piaagjddrrcbijienvll.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yd1wUT0mgOFUcqzbJl_9Cw_WZ8AX6Vp";
let sb = null;
function getClient(){
  if(!sb){ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  return sb;
}

// ─────────────────────────────────────────────────────────────── ESTADO
let PROFILE = null;   // { id, nombre, rol }
let TAB = "inicio";
let navStack = [];
let sheetOpen = false;
const DATA = { catalogo:null, clientes:null, pedidos:null, ordenes:null, proveedores:null, compras:null, preciosCostos:null, facturas:null, gastos:null, egresos:null, dolarBlue:null, stockValor:null };
let cart = [];
let venta = { cliente:null, descuento:0, envio:0, pago:"Tarjeta (Nave)" };

const $ = (s,el=document)=>el.querySelector(s);
const fmt = (n)=> "$" + Math.round(Number(n)||0).toLocaleString("es-AR");
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = ()=> new Date().toLocaleDateString("sv-SE",{timeZone:"America/Argentina/Buenos_Aires"});
const MESES_LARGO = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const mesLabel = (ym)=>{ const m=String(ym||"").match(/^(\d{4})-(\d{2})$/); return m ? `${MESES_LARGO[Number(m[2])-1]} ${m[1]}` : String(ym||""); };
const todayAR = ()=> new Date().toLocaleDateString("es-AR",{timeZone:"America/Argentina/Buenos_Aires"});
// Orden de talle: numéricos de menor a mayor, luego XS/S/M/L/XL/XXL/XXXL, el resto alfabético.
const SIZE_ORDER=['XS','S','M','L','XL','XXL','XXXL'];
function compareTalle(ta,tb){
  const na=Number(ta), nb=Number(tb);
  const aNum=!isNaN(na)&&String(ta).trim()!=="", bNum=!isNaN(nb)&&String(tb).trim()!=="";
  if(aNum&&bNum) return na-nb; if(aNum) return -1; if(bNum) return 1;
  const ai=SIZE_ORDER.indexOf(String(ta).toUpperCase()), bi=SIZE_ORDER.indexOf(String(tb).toUpperCase());
  if(ai!==-1&&bi!==-1) return ai-bi; return String(ta).localeCompare(String(tb));
}

function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); setTimeout(()=>t.className="toast",2600); }

// ─────────────────────────────────────────────────────────────── AUTH
async function login(){
  const email=$("#l-email").value.trim(), pass=$("#l-pass").value;
  const btn=$("#login-btn"); btn.disabled=true; btn.textContent="Ingresando…";
  $("#login-err").textContent="";
  try{
    const { data, error } = await getClient().auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    await loadProfile(data.user.id);
    if(!PROFILE){ await getClient().auth.signOut(); throw new Error("Tu usuario no tiene perfil asignado. Pedile a un admin que te dé acceso."); }
    showApp();
  }catch(e){ $("#login-err").textContent = e.message==="Invalid login credentials" ? "Email o contraseña incorrectos" : e.message; }
  btn.disabled=false; btn.textContent="Ingresar";
}
async function loadProfile(userId){
  const { data, error } = await getClient().from("012_profiles").select("id,nombre,rol").eq("id", userId).maybeSingle();
  if(error){ PROFILE=null; return; }
  PROFILE = data;
}
async function logout(){ await getClient().auth.signOut(); PROFILE=null; $("#app").style.display="none"; $("#login").style.display="flex"; }
function showApp(){
  $("#login").style.display="none"; $("#app").style.display="block";
  $("#h-sub").textContent = PROFILE ? (PROFILE.nombre || "NORD Uniformes") : "NORD Uniformes";
  navStack=[]; sheetOpen=false; TAB="inicio"; history.replaceState({tab:"inicio"},""); go("inicio",{push:false});
}

// ─────────────────────────────────────────────────────────────── NAV
const TITLES = {inicio:"Dashboard", stock:"Stock", vender:"Vender", pedidos:"Pedidos", ordenes:"Órdenes", clientes:"Clientes",
  proveedores:"Proveedores", compras:"Compras", precios:"Precios y costos", gastos:"Gastos", egresos:"Egresos", contabilidad:"Contabilidad", configuracion:"Catálogo"};
function go(tab,opts){
  opts=opts||{};
  if(opts.push!==false && TAB!==tab){ navStack.push(TAB); history.pushState({tab},""); }
  TAB=tab;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  $("#h-title").textContent = TITLES[tab];
  window.scrollTo(0,0);
  render();
  updateCartBar();
  updateBack();
}
function goBack(){ if(sheetOpen){ closeSheet(); return; } if(navStack.length) history.back(); }
function updateBack(){ const b=$("#back-btn"); if(b) b.style.display=(sheetOpen||navStack.length>0)?"grid":"none"; }
function refresh(){ DATA[mapData(TAB)] = null; render(true); toast("Actualizado"); }
function mapData(tab){ return (tab==="vender"||tab==="stock"||tab==="configuracion")?"catalogo": tab==="precios"?"preciosCostos": tab==="contabilidad"?"facturas": tab; }
const GASTO_CATEGORIAS = ["Logística","Bolsas y packaging","Software","Impuestos","Otros"];

// ─────────────────────────────────────────────────────────────── DATA (Supabase)
// Catálogo completo: prendas + talles + stock actual + precio vigente, en la
// misma forma que usaba erp.html (products[].talles[]) para no tener que
// tocar el resto de la UI de venta/stock.
async function fetchCatalogo(){
  const c = getClient();
  const [{ data: prendas, error: e1 }, { data: talles, error: e2 }, { data: stock, error: e3 }, { data: precios, error: e4 }] = await Promise.all([
    c.from("001_prendas").select("id,slug,nombre,descripcion,genero,categorias,foto1,foto2"),
    c.from("002_talles").select("id,product_id,talle,sku"),
    c.from("101_stock_actual").select("talle_id,stock"),
    c.from("102_precio_vigente").select("talle_id,precio_lista,precio_transferencia"),
  ]);
  if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4;
  const stockMap = Object.fromEntries((stock||[]).map(s=>[s.talle_id, s.stock]));
  const precioMap = Object.fromEntries((precios||[]).map(p=>[p.talle_id, p]));
  const byPrenda = {};
  (talles||[]).forEach(t=>{
    if(!byPrenda[t.product_id]) byPrenda[t.product_id]=[];
    const pr = precioMap[t.id] || {};
    byPrenda[t.product_id].push({
      talleId: t.id, talle: t.talle, sku: t.sku,
      stock: stockMap[t.id]||0,
      precio: Number(pr.precio_transferencia)||0,
      precioLista: Number(pr.precio_lista)||0,
    });
  });
  const SIZE_ORDER=['XS','S','M','L','XL','XXL','XXXL'];
  const talleSort=(a,b)=>{
    const na=Number(a.talle), nb=Number(b.talle);
    const aNum=!isNaN(na)&&String(a.talle).trim()!=="", bNum=!isNaN(nb)&&String(b.talle).trim()!=="";
    if(aNum&&bNum) return na-nb; if(aNum) return -1; if(bNum) return 1;
    const ai=SIZE_ORDER.indexOf(String(a.talle).toUpperCase()), bi=SIZE_ORDER.indexOf(String(b.talle).toUpperCase());
    if(ai!==-1&&bi!==-1) return ai-bi; return String(a.talle).localeCompare(String(b.talle));
  };
  return (prendas||[]).map(p=>{
    const ts=(byPrenda[p.id]||[]).sort(talleSort);
    const fotos=[p.foto1,p.foto2].filter(Boolean);
    const conPrecio=ts.filter(t=>t.precio>0);
    const base=conPrecio.length? conPrecio.reduce((m,t)=>t.precio<m.precio?t:m): {precio:0,precioLista:0};
    return { id:p.id, nombre:p.nombre, descripcion:p.descripcion, genero:p.genero, categorias:p.categorias||[],
      foto: fotos[0]||"", fotos, precio:base.precio, precioLista:base.precioLista, talles: ts };
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
async function getCatalogo(force){ if(force||!DATA.catalogo) DATA.catalogo = await fetchCatalogo(); return DATA.catalogo; }

async function fetchClientes(){
  const { data, error } = await getClient().from("003_clientes").select("id,colegio,nro,nombre,apellido,email,telefono,codigo").order("nombre");
  if(error) throw error;
  return data||[];
}
async function getClientes(force){ if(force||!DATA.clientes) DATA.clientes = await fetchClientes(); return DATA.clientes; }

async function fetchProveedores(){
  const { data, error } = await getClient().from("008_proveedores").select("id,nombre").order("nombre");
  if(error) throw error;
  return data||[];
}
async function getProveedores(force){ if(force||!DATA.proveedores) DATA.proveedores = await fetchProveedores(); return DATA.proveedores; }

// Pedidos con saldo + cliente + items, armado sobre la vista 104_pedidos_con_saldo
async function fetchPedidos(){
  const c = getClient();
  const [{ data: peds, error: e1 }, { data: clientes, error: e2 }, { data: facturas, error: e3 }] = await Promise.all([
    c.from("104_pedidos_con_saldo").select("*").order("created_at",{ascending:false}),
    c.from("003_clientes").select("id,nombre,apellido,codigo"),
    c.from("007_facturas").select("*"),
  ]);
  if(e1) throw e1; if(e2) throw e2; if(e3) throw e3;
  const cliMap = Object.fromEntries((clientes||[]).map(c=>[c.id, c]));
  const facMap = Object.fromEntries((facturas||[]).map(f=>[f.pedido_id, f]));
  return (peds||[]).map(p=>{
    const cli = cliMap[p.cliente_id] || {};
    return { ...p, clienteNombre: `${cli.nombre||""} ${cli.apellido||""}`.trim(), clienteCodigo: cli.codigo||"",
      factura: facMap[p.id]||null };
  });
}
async function getPedidos(force){ if(force||!DATA.pedidos) DATA.pedidos = await fetchPedidos(); return DATA.pedidos; }

// ─────────────────────────────────────────────────────────────── ÓRDENES (detalle de venta, línea por línea)
async function fetchOrdenes(){
  const c = getClient();
  const [{ data: ordenes, error: e1 }, { data: pedidos, error: e2 }, { data: clientes, error: e3 }] = await Promise.all([
    c.from("005_ordenes").select("*").order("id",{ascending:false}).limit(500),
    c.from("004_pedidos").select("id,numero,created_at,cliente_id"),
    c.from("003_clientes").select("id,nombre,apellido"),
  ]);
  if(e1) throw e1; if(e2) throw e2; if(e3) throw e3;
  const pedMap = Object.fromEntries((pedidos||[]).map(p=>[p.id,p]));
  const cliMap = Object.fromEntries((clientes||[]).map(c2=>[c2.id,c2]));
  return (ordenes||[]).map(o=>{
    const ped = pedMap[o.pedido_id] || {};
    const cli = cliMap[ped.cliente_id] || {};
    return { ...o, pedidoNumero: ped.numero||"", fecha: ped.created_at?ped.created_at.slice(0,10):"",
      clienteNombre: `${cli.nombre||""} ${cli.apellido||""}`.trim() };
  });
}
async function getOrdenes(force){ if(force||!DATA.ordenes) DATA.ordenes = await fetchOrdenes(); return DATA.ordenes; }
async function viewOrdenes(v,force){
  try{
    if(force||!DATA.ordenes){ loading(v); await Promise.all([getOrdenes(true), getCatalogo(force)]); }
    else await getCatalogo();
    window._orCatMap = Object.fromEntries((DATA.catalogo||[]).map(pr=>[pr.nombre,pr]));
    window._orQ = window._orQ||"";
    window._orSort = window._orSort||{field:"fecha",dir:-1};
    v.innerHTML=`
      <div class="view-title">Órdenes</div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-8px">Detalle línea por línea de todo lo vendido (últimas 500). Talle, cantidad y descuento son editables directo; tocá el número de pedido para abrirlo.</p>
      <div class="search"><span class="mag">🔎</span><input id="or-q" placeholder="Buscar prenda, pedido o cliente…" value="${esc(window._orQ)}"></div>
      <div class="table-wrap"><table class="pr-table" id="or-table">
        <thead><tr>
          <th data-field="fecha">Fecha</th>
          <th data-field="pedidoNumero">Pedido</th>

    const inp=$("#or-q");

          <td>${esc(o.clienteNombre||"—")}</td>
          <td>${esc(o.nombre_prenda||"")}</td>

          <td id="or-sub-${o.id}" style="font-weight:700">${fmt(subtotal)}</td>
          <td><button type="button" class="oi-del" title="Eliminar" onclick='orDeleteItem(${JSON.stringify(o.id)})'>✕</button></td>
        </tr>`;
      }).join("") : `<tr><td colspan="10"><div class="empty">Sin órdenes todavía</div></td></tr>`;
      $("#or-table").querySelectorAll("th[data-field]").forEach(th=>{
        th.classList.toggle("sorted", th.dataset.field===field);
        th.querySelectorAll(".arrow").forEach(a=>a.remove());
        if(th.dataset.field===field) th.insertAdjacentHTML("beforeend", `<span class="arrow">${dir>0?"▲":"▼"}</span>`);
      });
    };
    inp.oninput=draw;
    $("#or-table").querySelectorAll("th[data-field]").forEach(th=>{
      th.onclick=()=>{
        const f=th.dataset.field;
        if(window._orSort.field===f) window._orSort.dir*=-1; else window._orSort={field:f,dir:f==="fecha"?-1:1};
        draw();
      };
    });
    draw();
  }catch(e){ errBox(v,e); }
}
function orTalleSelectHtml(o){
  const prenda=window._orCatMap[o.nombre_prenda];

    `<option value="${t.talleId}" ${t.talleId===o.talle_id?"selected":""}>${esc(t.talle)}</option>`).join("")}</select>`;

async function orChangeTalle(id, talleId){
  const o=(DATA.ordenes||[]).find(x=>x.id===id); if(!o) return;
  const prenda=window._orCatMap[o.nombre_prenda]; if(!prenda) return;
  const nuevoTalle=prenda.talles.find(t=>t.talleId===talleId); if(!nuevoTalle) return;
  if(talleId===o.talle_id) return;
  const viejoTalle=prenda.talles.find(t=>t.talleId===o.talle_id);
  const baseViejo=oiListaFor(viejoTalle);
  const descPct = o.descuento_pct!=null ? Math.round(o.descuento_pct)
    : (baseViejo>0 ? Math.max(0, Math.round((1-o.precio_unitario/baseViejo)*100)) : 0);
  const baseNuevo=oiListaFor(nuevoTalle);
  const nuevoPrecio=Math.round(baseNuevo*(1-descPct/100));
  let costo=o.costo_unitario;
  try{
    const { data:c } = await getClient().from("103_costo_vigente").select("costo").eq("talle_id",talleId).maybeSingle();
    if(c) costo=Number(c.costo)||0;
  }catch(e){}
  await orPersist(id, { talle_id:talleId, talle:nuevoTalle.talle, precio_unitario:nuevoPrecio, costo_unitario:costo, descuento_pct:descPct });
}
function orEditCell(td){
  if(td.querySelector("input")) return;
  const id=td.dataset.id, field=td.dataset.field;
  const o=(DATA.ordenes||[]).find(x=>x.id===id); if(!o) return;
  const cur = field==="descuento_pct" ? (o.descuento_pct!=null?Math.round(o.descuento_pct):0) : o[field];
  const display = field==="descuento_pct" ? (o.descuento_pct!=null?Math.round(o.descuento_pct)+"%":"—") : String(o[field]);
  td.innerHTML=`<input type="text" inputmode="numeric" value="${cur}">`;
  const input=td.querySelector("input");
  input.focus(); input.select();
  let done=false;
  const cancel=()=>{ if(done) return; done=true; td.innerHTML=display; };
  const commit=()=>{ if(done) return; done=true; orSaveCell(id, field, +input.value||0); };
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", commit);
}
async function orSaveCell(id, field, value){
  const o=(DATA.ordenes||[]).find(x=>x.id===id); if(!o) return;
  const td=document.querySelector(`.pr-editable[data-id="${id}"][data-field="${field}"]`);
  if(field==="cantidad"){
    const cantidad=Math.max(1, Math.round(value));
    if(cantidad===o.cantidad){ if(td) td.innerHTML=o.cantidad; return; }
    await orPersist(id, { cantidad });
  } else {
    const prenda=window._orCatMap[o.nombre_prenda];
    const talleObj=prenda?prenda.talles.find(t=>t.talleId===o.talle_id):null;
    const base=oiListaFor(talleObj);
    const d=Math.min(100,Math.max(0,value));
    if(o.descuento_pct!=null && Math.round(o.descuento_pct)===d){ if(td) td.innerHTML=d+"%"; return; }
    const precio_unitario = base>0 ? Math.round(base*(1-d/100)) : o.precio_unitario;
    await orPersist(id, { descuento_pct:d, precio_unitario });
  }
}
async function orPersist(id, patch){
  const o=(DATA.ordenes||[]).find(x=>x.id===id); if(!o) return;
  try{
    const { error } = await getClient().from("005_ordenes").update(patch).eq("id", id);
    if(error) throw error;
    Object.assign(o, patch);
    const precEl=$("#or-precio-"+id); if(precEl) precEl.textContent=fmt(o.precio_unitario);
    const subEl=$("#or-sub-"+id); if(subEl) subEl.textContent=fmt((Number(o.cantidad)||0)*(Number(o.precio_unitario)||0));
    const cantEl=document.querySelector(`.pr-editable[data-id="${id}"][data-field="cantidad"]`);
    if(cantEl) cantEl.innerHTML=o.cantidad;
    const descEl=document.querySelector(`.pr-editable[data-id="${id}"][data-field="descuento_pct"]`);
    if(descEl) descEl.innerHTML = o.descuento_pct!=null?Math.round(o.descuento_pct)+"%":"—";
    DATA.pedidos=null; // el total del pedido pudo haber cambiado
  }catch(e){ toast(friendlyError(e),true); }
}
async function orDeleteItem(id){
  const o=(DATA.ordenes||[]).find(x=>x.id===id); if(!o) return;
  if(!(await confirmDialog(`¿Eliminar "${o.nombre_prenda}" talle ${o.talle} del pedido ${o.pedidoNumero||""}?`))) return;

// Traduce los errores más comunes de Postgres/Supabase a algo que Flor/Fede
// puedan entender sin googlear -- si no reconoce el patrón, muestra el
// mensaje original tal cual (mejor eso que nada).
function friendlyError(e){
  const msg = (e && e.message) || String(e||"");
  let m;
  if ((m = /duplicate key value violates unique constraint.*Key \(([^)]+)\)=\(([^)]+)\)/is.exec(msg))) {
    return `Ya existe un registro con ${m[1].replace(/_/g," ")} = "${m[2]}" — no se puede repetir.`;
  }
  if (/duplicate key value violates unique constraint/i.test(msg)) {
    return "Ya existe un registro igual a este — no se puede repetir.";
  }
  if ((m = /null value in column "([^"]+)"/i.exec(msg))) {
    return `Falta completar el campo "${m[1].replace(/_/g," ")}".`;
  }
  if (/violates foreign key constraint/i.test(msg)) {
    return "No se puede completar porque este registro está relacionado con otro (por ejemplo, tiene ventas o compras asociadas).";
  }
  if (/JWT expired|invalid JWT|not authenticated|refresh_token/i.test(msg)) {
    return "Tu sesión venció — volvé a iniciar sesión.";
  }
  if (/Failed to fetch|NetworkError|network request failed/i.test(msg)) {
    return "No se pudo conectar — revisá tu conexión a internet e intentá de nuevo.";
  }
  return msg;
}
function errBox(v,e){ v.innerHTML=`<div class="empty">⚠️ ${esc(friendlyError(e))}<br><br><button class="btn ghost sm" onclick="render(true)">Reintentar</button></div>`; }

const fmtUsd = (n)=> "US$" + Math.round(Number(n)||0).toLocaleString("es-AR");
// Cotización diaria del dólar blue (014_dolar_blue) — se usa para convertir
// ventas/ganancia a USD en el Dashboard, cotización del día de cada operación
// (no un promedio mensual). Se mantiene al día sola: cada vez que se abre el
// Dashboard, si falta algún día completa desde api.argentinadatos.com (no
// hace falta cron ni función serverless nueva).
async function fetchDolarBlue(){
  const { data, error } = await getClient().from("014_dolar_blue").select("fecha,promedio");
  if(error) throw error;
  return Object.fromEntries((data||[]).map(r=>[r.fecha, Number(r.promedio)||0]));
}
async function getDolarBlue(force){ if(force||!DATA.dolarBlue) DATA.dolarBlue = await fetchDolarBlue(); return DATA.dolarBlue; }
async function ensureDolarBlueUpToDate(){
  try{
    const { data: last } = await getClient().from("014_dolar_blue").select("fecha").order("fecha",{ascending:false}).limit(1).maybeSingle();
    const today = todayISO();
    if(last && last.fecha>=today) return;
    const r = await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/blue");
    if(!r.ok) return;
    const all = await r.json();
    const rows = (all||[])
      .filter(x=>x.fecha && x.compra && x.venta && (!last || x.fecha>last.fecha) && x.fecha<=today)
      .map(x=>({ fecha:x.fecha, compra:Number(x.compra), venta:Number(x.venta) }));
    if(rows.length){
      const { error } = await getClient().from("014_dolar_blue").upsert(rows, { onConflict:"fecha" });
      if(!error) DATA.dolarBlue=null;
    }
  }catch(e){ console.error("No se pudo actualizar la cotización del dólar blue:", e); }
}
// Valorización de stock: cantidad, costo de reposición total y valorización
// de venta (a precio de lista) por prenda, sumando todos sus talles.
async function fetchStockValorizacion(){
  const c=getClient();
  const [{ data: prendas, error:e1 }, { data: talles, error:e2 }, { data: stock, error:e3 }, { data: costos, error:e4 }, { data: precios, error:e5 }] = await Promise.all([
    c.from("001_prendas").select("id,nombre"),
    c.from("002_talles").select("id,product_id"),
    c.from("101_stock_actual").select("talle_id,stock"),
    c.from("103_costo_vigente").select("talle_id,costo"),
    c.from("102_precio_vigente").select("talle_id,precio_lista"),
  ]);
  if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4; if(e5) throw e5;
  const prodByTalle = Object.fromEntries((talles||[]).map(t=>[t.id,t.product_id]));
  const stockMap = Object.fromEntries((stock||[]).map(s=>[s.talle_id, Number(s.stock)||0]));
  const costoMap = Object.fromEntries((costos||[]).map(cc=>[cc.talle_id, Number(cc.costo)||0]));
  const precioMap = Object.fromEntries((precios||[]).map(p=>[p.talle_id, Number(p.precio_lista)||0]));
  const porProd = {};
  (talles||[]).forEach(t=>{
    const st=stockMap[t.id]||0; if(st<=0) return;
    if(!porProd[t.product_id]) porProd[t.product_id]={cantidad:0, costoTotal:0, ventaTotal:0};
    porProd[t.product_id].cantidad += st;
    porProd[t.product_id].costoTotal += st*(costoMap[t.id]||0);
    porProd[t.product_id].ventaTotal += st*(precioMap[t.id]||0);
  });
  const nombreById = Object.fromEntries((prendas||[]).map(p=>[p.id,p.nombre]));
  return Object.entries(porProd).map(([pid,v])=>({ nombre: nombreById[pid]||"—", ...v }))
    .sort((a,b)=>b.ventaTotal-a.ventaTotal);
}

async function loadGA4(){
  const box=$("#ga4-box"); if(!box) return;
  box.innerHTML='<div class="card"><div class="spinner" style="margin:14px auto"></div></div>';
  try{
    const token=await getAccessToken(); if(!token) throw new Error("Sesión inválida, volvé a iniciar sesión");
    const r=await fetch("/api/erp?action=ga4-metrics",{headers:{Authorization:`Bearer ${token}`}});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"No se pudo cargar el tráfico");
    const ov=d.overview||{};
    const daily=d.daily||[]; const maxS=Math.max(1,...daily.map(x=>x.sessions));
    const dbars=daily.map(x=>`<div class="db" style="height:${Math.max(2,x.sessions/maxS*100).toFixed(1)}%" title="${x.date?x.date.slice(6,8)+'/'+x.date.slice(4,6):''}: ${x.sessions} ses."></div>`).join("");
    const pages=d.topPages||[]; const maxPv=Math.max(1,...pages.map(p=>p.pageviews));

// ─────────────────────────────────────────────────────────────── VENDER
// Dos capas de descuento, que NO se acumulan entre sí (una anula a la otra
// por línea, a pedido de Flor 2026-09-27 — antes se acumulaban):
//  1) Por medio de pago: si la línea no tiene descuento manual, Transf./
//     Efectivo bajan SOLOS de lista a transferencia, sin tocar nada.
//     Tarjeta se queda en lista.
//  2) Promo: el % que se carga a mano en cada línea reemplaza al de arriba
//     y se calcula siempre sobre precio de lista (nunca sobre transferencia),
//     sea cual sea el medio de pago.
// Excepción -- Chomba Blanca: el 30% OFF es automático (no se carga a mano)
// pero cubre como mucho 1 unidad EN TOTAL en todo el pedido, aunque haya
// varias líneas en distintos talles (misma regla que la promo del sitio
// público) -- el resto de las unidades quedan solo con el descuento por
// medio de pago. Se recalcula con recomputeChombaPromo() cada vez que
// cambia el carrito.
const CARD_SURCHARGE = 1.15;
const CHOMBA_BLANCA_NOMBRE = "Chomba Blanca";
const CHOMBA_PROMO_PCT = 30;
function isCard(){ return /nave|tarjeta/i.test(venta.pago); }
function basePrice(i){ return i.precioLista>0 ? i.precioLista : Math.round(i.precio*CARD_SURCHARGE); }
function priceAfterPaymentMethod(i){ return isCard() ? basePrice(i) : i.precio; }
function recomputeChombaPromo(){
  let remaining=1;
  cart.forEach(i=>{
    if(i.nombre!==CHOMBA_BLANCA_NOMBRE){ i._promoQty=0; return; }
    const used=Math.min(i.qty, remaining);
    i._promoQty=used; remaining-=used;
  });
}
function unitPrice(i){
  if(i.nombre===CHOMBA_BLANCA_NOMBRE){
    const pq=Math.min(i._promoQty||0, i.qty);
    const normal=priceAfterPaymentMethod(i);
    if(pq<=0) return normal;
    const conPromo=Math.round(basePrice(i)*(1-CHOMBA_PROMO_PCT/100));
    return Math.round((conPromo*pq + normal*(i.qty-pq))/i.qty);
  }
  const d=Math.min(100,Math.max(0,i.descPct||0));
  if(d>0) return Math.round(basePrice(i)*(1-d/100));
  return priceAfterPaymentMethod(i);
}
function effectiveDescPct(i){
  if(i.nombre===CHOMBA_BLANCA_NOMBRE){
    const lista=basePrice(i);
    return lista>0 ? Math.round((1-unitPrice(i)/lista)*100) : 0;
  }
  return i.descPct||0;
}
function cartGrossSubtotal(){ return cart.reduce((s,i)=>s+basePrice(i)*i.qty,0); }
function cartPaymentDiscountTotal(){ return cart.reduce((s,i)=>s+(basePrice(i)-priceAfterPaymentMethod(i))*i.qty,0); }
function cartPromoDiscountTotal(){ return cart.reduce((s,i)=>s+(priceAfterPaymentMethod(i)-unitPrice(i))*i.qty,0); }
function cartSubtotal(){ return cart.reduce((s,i)=>s+unitPrice(i)*i.qty,0); }
function cartTotal(){ return Math.max(0, cartSubtotal() - (venta.descuento||0) + (venta.envio||0)); }
// Inputs de monto ($): sin flechitas de number, con separador de miles en vivo.
function fmtMiles(n){ n=Math.round(Number(n)||0); return n?n.toLocaleString("es-AR"):""; }
function parseMiles(s){ return Number(String(s||"").replace(/\D/g,""))||0; }
function milesOnInput(el){ const n=parseMiles(el.value); el.value=fmtMiles(n); return n; }

// Combobox de prenda (escribís o elegís del dropdown nativo): apenas el texto
// coincide con una prenda del catálogo, aparece su selector de talle abajo
// mismo -- sin buscador ni lista aparte, como un POS de mostrador.
function onPrendaInput(val){
  const name=(val||"").trim().toLowerCase();
  const p=(DATA.catalogo||[]).find(x=>x.nombre.toLowerCase()===name);
  window._vSelectedPrenda = p ? p.id : null;

function drawTallePicker(){
  const box=$("#v-talle-picker"); if(!box) return;
  const p=(DATA.catalogo||[]).find(x=>x.id===window._vSelectedPrenda);
  if(!p){ box.innerHTML=""; return; }

    <div class="name" style="margin-bottom:8px">${esc(p.nombre)}</div>

  </div>`;
}
function talleRows(p){
  return p.talles.map(t=>{
    const q=cartQtyFor(t.talleId);
    const over = q>t.stock;
    return `<div class="row">
      <div class="grow"><div class="name">Talle ${esc(t.talle)}</div>
        <div class="meta">${fmt(t.precioLista)} <span style="color:var(--muted)">· Transf. ${fmt(t.precio)}</span> · stock ${t.stock}${t.stock<=0?' · <span style="color:var(--red)">sin stock</span>':''}${over?` · <span style="color:var(--amber)">pedís ${q}</span>`:''}</div></div>
      <div class="qty"><button onclick='chQtyTalle(${JSON.stringify(p.id)},${JSON.stringify(t.talleId)},-1)'>−</button><span>${q}</span><button onclick='chQtyTalle(${JSON.stringify(p.id)},${JSON.stringify(t.talleId)},1)'>+</button></div>
    </div>`;
  }).join("");
}
function cartQtyFor(talleId){ const i=cart.find(x=>x.talleId===talleId); return i?i.qty:0; }
function chQtyTalle(prendaId, talleId, delta){
  const p=(DATA.catalogo||[]).find(x=>x.id===prendaId); const t=p.talles.find(x=>x.talleId===talleId);
  let i=cart.find(x=>x.talleId===talleId);
  if(!i && delta>0){ i={talleId,nombre:p.nombre,talle:t.talle,precio:t.precio,precioLista:t.precioLista,qty:0,stock:t.stock,descPct:0}; cart.push(i); }
  if(i){
    i.qty+=delta;
    if(i.qty<=0) cart=cart.filter(x=>x!==i);
    else if(delta>0 && t.stock>=0 && i.qty>t.stock) toast(`⚠ Sólo hay ${t.stock} en stock — el resto queda a pedido`, true);
  }
  recomputeChombaPromo();
  const cont=$("#talle-rows"); if(cont) cont.innerHTML=talleRows(p);
  drawCart();
}
function chQty(idx,d){
  const i=cart[idx]; if(!i) return;
  i.qty+=d;
  if(i.qty<=0){ cart.splice(idx,1); recomputeChombaPromo(); drawCart(); drawTallePicker(); return; }
  recomputeChombaPromo();
  drawCart(); drawTallePicker();
}
function cartPrecioHtml(i){ return `<b>${fmt(basePrice(i))}</b> lista<div class="oi-lista">c/u ${fmt(unitPrice(i))}</div>`; }
function setItemDesc(idx,val){
  const n=Math.min(100,Math.max(0,+val||0));
  const i=cart[idx]; if(!i) return;
  i.descPct=n;
  const precEl=$("#cart-precio-"+idx); if(precEl) precEl.innerHTML=cartPrecioHtml(i);
  const subEl=$("#cart-sub-"+idx); if(subEl) subEl.textContent=fmt(unitPrice(i)*i.qty);
  drawTotals();
}
function cartChangeTalle(idx,talleId){
  const i=cart[idx]; if(!i) return;
  const prenda=(DATA.catalogo||[]).find(p=>p.nombre===i.nombre); if(!prenda) return;
  const t=prenda.talles.find(x=>x.talleId===talleId); if(!t) return;
  // si ya había otra línea con ese talle, se fusionan sumando cantidades en vez de duplicar
  const dupIdx=cart.findIndex((x,j)=>j!==idx && x.talleId===talleId);
  if(dupIdx!==-1){ cart[dupIdx].qty+=i.qty; cart.splice(idx,1); recomputeChombaPromo(); drawCart(); drawTallePicker(); return; }
  i.talleId=t.talleId; i.talle=t.talle; i.precio=t.precio; i.precioLista=t.precioLista; i.stock=t.stock;
  recomputeChombaPromo();
  drawCart(); drawTallePicker();
}
function clearCart(){ cart=[]; drawCart(); drawTallePicker(); }
function cartRowHtml(i,idx){
  const prenda=(DATA.catalogo||[]).find(p=>p.nombre===i.nombre);
  const talles=prenda?prenda.talles:[];
  const talleOpts=talles.length
    ? talles.map(t=>`<option value="${t.talleId}" ${t.talleId===i.talleId?"selected":""}>${esc(t.talle)}</option>`).join("")
    : `<option value="${i.talleId||''}" selected>${esc(i.talle)}</option>`;
  const over=i.stock!=null && i.qty>i.stock;
  const isChomba=i.nombre===CHOMBA_BLANCA_NOMBRE;
  const descHtml=isChomba
    ? `<span class="oi-ro" title="30% OFF automático en 1 unidad — el resto queda al precio según medio de pago">${(i._promoQty||0)>0?"Promo 30%":"—"}</span>`
    : `<div class="oi-desc-wrap"><input type="text" inputmode="numeric" id="cart-desc-${idx}" value="${i.descPct||0}" oninput="setItemDesc(${idx},this.value)"><span>%</span></div>`;
  return `<div class="row oi-row" id="cart-row-${idx}">
    <div class="oi-nombre" title="${esc(i.nombre)}">${esc(i.nombre)}${over?' ⚠':''}</div>
    <select class="oi-talle" onchange="cartChangeTalle(${idx}, this.value)">${talleOpts}</select>
    <div class="qty"><button onclick="chQty(${idx},-1)">−</button><span id="cart-qty-${idx}">${i.qty}</span><button onclick="chQty(${idx},1)">+</button></div>
    <div class="oi-precio" id="cart-precio-${idx}">${cartPrecioHtml(i)}</div>
    ${descHtml}
    <span class="oi-subtotal" id="cart-sub-${idx}">${fmt(unitPrice(i)*i.qty)}</span>
  </div>`;
}
function drawCart(){
  const c=$("#v-cart"); if(!c) return;
  if(!cart.length){ c.innerHTML='<div class="empty">Todavía no agregaste prendas</div>'; drawCheckout(); updateCartBar(); return; }

}
function updateCartBar(){

    ${isCard()?'<p style="font-size:12px;color:var(--muted);margin:-4px 0 12px">💳 Al registrar se genera el link de pago Nave para enviar al cliente por WhatsApp.</p>':''}
    <div id="v-totals"></div>

// Registra el pedido completo: header en 004_pedidos, detalle en 005_ordenes
// (con precio/costo congelados al momento de vender) y, si ya se cobró en el
// momento, un pago en 006_pagos.
async function registrarPedido(){
  if(!cart.length) return toast("Agregá prendas primero",true);
  if(!venta.cliente) return toast("Elegí un cliente",true);
  const card=isCard();
  const btn=$("#v-submit"); btn.disabled=true; btn.textContent=card?"Generando…":"Registrando…";
  try{
    const c=getClient();
    const { data: costos } = await c.from("103_costo_vigente").select("talle_id,costo");
    const costoMap = Object.fromEntries((costos||[]).map(x=>[x.talle_id, Number(x.costo)||0]));

    const { data: pedido, error: eP } = await c.from("004_pedidos").insert({
      colegio: venta.cliente.colegio||"WS", cliente_id: venta.cliente.id, forma_pago: venta.pago,
      cargo_envio: venta.envio||0, descuento: venta.descuento||0,
    }).select().single();
    if(eP) throw eP;

    const items = cart.map(i=>({
      pedido_id: pedido.id, talle_id: i.talleId, nombre_prenda: i.nombre, talle: i.talle,
      cantidad: i.qty, precio_unitario: unitPrice(i), costo_unitario: costoMap[i.talleId]||0,
      descuento_pct: effectiveDescPct(i),
    }));
    const { error: eI } = await c.from("005_ordenes").insert(items);
    if(eI){
      // El pedido cabecera ya se creó pero sin ítems -- no dejarlo como
      // fantasma de $0 en la lista de Pedidos, se borra de nuevo.
      try{ await c.from("004_pedidos").delete().eq("id", pedido.id); }catch(delErr){}
      throw eI;
    }

    const total=cartTotal();
    let naveUrl="";
    if(card){
      try{
        const nr=await fetch("/api/nave/create-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
          orderId:pedido.id, total, nombreCliente:(venta.cliente.nombre+" "+(venta.cliente.apellido||"")).trim(),
          email:venta.cliente.email||"", telefono:venta.cliente.telefono||"",
          items:cart.map(i=>({nombre:i.nombre,talle:i.talle,qty:i.qty,precio:unitPrice(i)})),
        })});
        const nd=await nr.json();
        if(nr.ok && nd.checkout_url) naveUrl=nd.checkout_url;
        else throw new Error(nd.error||"No se pudo generar el link");
      }catch(ne){ toast("Pedido guardado, pero el link falló: "+ne.message, true); }
    }

    const resumen=buildResumen(pedido.numero, total, naveUrl);
    const waTel=venta.cliente.telefono||"";
    const waLabel=waTel?"Enviar al WhatsApp del cliente":"Enviar por WhatsApp";
    $("#view").innerHTML=`
      <div class="card" style="text-align:center;padding:28px 20px">
        <div style="font-size:44px">✅</div>
        <h2 style="margin:8px 0 2px">Pedido ${esc(pedido.numero)}</h2>
        <p style="color:var(--muted);margin:0 0 4px">${esc((venta.cliente.nombre+" "+(venta.cliente.apellido||"")).trim())}</p>
        <div style="font-size:26px;font-weight:800;margin:10px 0">${fmt(total)}</div>
        ${naveUrl?`<div class="field" style="text-align:left;margin-top:8px"><label>Link de pago (Nave)</label><input id="nave-url" readonly value="${esc(naveUrl)}" onclick="this.select()"></div>
          <button class="btn ghost" onclick='copyText(${JSON.stringify(naveUrl)},"Link copiado")'>Copiar link de pago</button>`:''}
        <button class="btn gold" style="margin-top:10px" onclick='waResumen(${JSON.stringify(resumen)},${JSON.stringify(waTel)})'>${waLabel}</button>
        <button class="btn ghost" style="margin-top:10px" onclick="nuevoPedido()">Nuevo pedido</button>
      </div>`;
    cart=[]; venta={cliente:null,descuento:0,envio:0,pago:"Tarjeta (Nave)"};
    DATA.pedidos=null; DATA.catalogo=null;
    updateCartBar();
  }catch(e){ toast(friendlyError(e),true); btn.disabled=false; btn.textContent=card?"Registrar y generar link":"Registrar pedido"; }
}
function buildResumen(numero,total,naveUrl){
  const items = cart.map(i=>`• ${i.nombre} T${i.talle} x${i.qty} — ${fmt(unitPrice(i)*i.qty)}`).join("\n");
  let s=`*Pedido #${numero}* — NORD Uniformes\nCliente: ${venta.cliente.nombre} ${venta.cliente.apellido||""}\n\n${items}\n`;
  if(venta.descuento) s+=`Descuento: −${fmt(venta.descuento)}\n`;
  if(venta.envio) s+=`Envío: ${fmt(venta.envio)}\n`;
  s+=`\n*Total: ${fmt(total)}*\nForma de pago: ${venta.pago}`;
  if(naveUrl) s+=`\n\n💳 Pagá con tarjeta acá: ${naveUrl}`;
  return s;
}
function copyText(txt,msg){ navigator.clipboard?.writeText(txt).then(()=>toast(msg||"Copiado")).catch(()=>{}); }
function waNumber(tel){ const d=String(tel||"").replace(/\D/g,""); if(!d) return ""; return d.startsWith("54") ? d : "549"+d.replace(/^0/,""); }
function waResumen(txt,tel){ copyText(txt,"Resumen copiado"); const num=waNumber(tel); window.open(`https://wa.me/${num}?text=`+encodeURIComponent(txt),"_blank"); }
function nuevoPedido(){ go("vender"); }

// Base "sin descuento" de un talle: precio de lista (misma lógica que Vender).
function oiListaFor(talleObj){
  if(!talleObj) return 0;
  return talleObj.precioLista>0 ? talleObj.precioLista : Math.round(talleObj.precio*CARD_SURCHARGE);
}
function oiToggleEdit(){
  window._pedEditMode = !window._pedEditMode;
  const btn=$("#oi-edit-toggle"); if(btn) btn.textContent = window._pedEditMode ? "✓ Listo" : "✏️ Editar prendas";
  const el=$("#oi-items"); if(el) el.innerHTML = oiItemsContainerHtml();
}
function oiRowHtml(it,idx){
  const prenda=window._pedCatMap[it.nombre_prenda];
  const talles=prenda?prenda.talles:[];
  const curTalle=talles.find(t=>t.talleId===it.talle_id);
  const base=oiListaFor(curTalle) || it.precio_unitario;
  const lista=oiListaFor(curTalle) || base;
  // Se usa el % guardado al momento de vender; si es una fila vieja de antes de que
  // existiera esa columna (null), se lo estima contra el precio vigente de hoy.
  const descPct = it.descuento_pct!=null ? Math.round(it.descuento_pct)
    : (base>0 ? Math.max(0, Math.round((1-it.precio_unitario/base)*100)) : 0);
  const editing=!!window._pedEditMode;
  const talleHtml = editing
    ? `<select class="oi-talle" onchange="oiChangeTalle(${idx}, this.value)">${talles.length
        ? talles.map(t=>`<option value="${t.talleId}" ${t.talleId===it.talle_id?"selected":""}>${esc(t.talle)}</option>`).join("")
        : `<option value="${it.talle_id||''}" selected>${esc(it.talle)}</option>`}</select>`
    : `<span class="oi-ro">T${esc(it.talle)}</span>`;
  const qtyHtml = editing
    ? `<div class="qty"><button onclick="oiChangeQty(${idx},-1)">−</button><span id="oi-qty-${idx}">${it.cantidad}</span><button onclick="oiChangeQty(${idx},1)">+</button></div>`
    : `<span class="oi-ro">×${it.cantidad}</span>`;
  const descHtml = editing
    ? `<div class="oi-desc-wrap"><input type="text" inputmode="numeric" id="oi-desc-${idx}" value="${descPct}" onchange="oiChangeDesc(${idx}, this.value)"><span>%</span></div>`
    : `<span class="oi-ro">${descPct}%</span>`;
  const delHtml = editing
    ? `<button type="button" class="oi-del" title="Eliminar prenda" onclick="oiDeleteItem(${idx})">✕</button>`
    : "";
  return `<div class="row oi-row${editing?" editing":""}" id="oi-row-${idx}">
    <div class="oi-nombre" title="${esc(it.nombre_prenda)}">${esc(it.nombre_prenda)}</div>
    ${talleHtml}
    ${qtyHtml}
    <div class="oi-precio" id="oi-precio-${idx}"><b>${fmt(lista)}</b> lista<div class="oi-lista">c/u ${fmt(it.precio_unitario)}</div></div>
    ${descHtml}
    <span class="oi-subtotal" id="oi-sub-${idx}">${fmt(it.cantidad*it.precio_unitario)}</span>
    ${delHtml}
  </div>`;
}
// Ítems + (si está en modo edición) el mini-form de "+ Agregar prenda" al pie.

function oiAddFormHtml(){

function oiAddFillTalles(){

async function oiAddItem(){

  const btn=document.querySelector("#oi-add-row button"); if(btn){ btn.disabled=true; btn.textContent="Agregando…"; }
  try{
    const base=oiListaFor(talleObj) || 0;
    let costo=0;
    try{
      const { data: c } = await getClient().from("103_costo_vigente").select("costo").eq("talle_id",talleId).maybeSingle();
      costo = Number(c?.costo)||0;
    }catch(e){}
    const { data: nuevo, error } = await getClient().from("005_ordenes").insert({
      pedido_id: window._pedCurrent.id, talle_id: talleId, nombre_prenda: nombre, talle: talleObj.talle,
      cantidad: qty, precio_unitario: base, costo_unitario: costo, descuento_pct: 0,
    }).select().single();

    window._pedItems.push(nuevo);

    toast("Prenda agregada");
  }catch(e){ toast(friendlyError(e),true); if(btn){ btn.disabled=false; btn.textContent="+ Agregar"; } }

async function oiDeleteItem(idx){
  const it=window._pedItems[idx]; if(!it) return;
  if(!(await confirmDialog(`¿Eliminar "${it.nombre_prenda}" talle ${it.talle} del pedido?`))) return;
  try{
    const { error } = await getClient().from("005_ordenes").delete().eq("id", it.id);
    if(error) throw error;
    window._pedItems.splice(idx,1);
    const el=$("#oi-items"); if(el) el.innerHTML=oiItemsContainerHtml();
    oiRecalcTotals();
  }catch(e){ toast(friendlyError(e),true); }
}
function oiRecalcTotals(){
  const p=window._pedCurrent; if(!p) return;
  const monto=window._pedItems.reduce((s,it)=>s+it.cantidad*it.precio_unitario,0);
  p.monto=monto; p.total_venta=monto+(Number(p.cargo_envio)||0)-(Number(p.descuento)||0); p.saldo=p.total_venta-(Number(p.monto_pagado)||0);
  const el=$("#oi-totals"); if(el) el.innerHTML=oiTotalsHtml(p);
  DATA.pedidos=null; // refrescar cache al volver a la lista
}
async function oiPersist(idx){
  const it=window._pedItems[idx]; if(!it) return;
  try{
    const { error } = await getClient().from("005_ordenes").update({
      talle_id: it.talle_id, talle: it.talle, cantidad: it.cantidad, precio_unitario: it.precio_unitario, costo_unitario: it.costo_unitario,
      descuento_pct: it.descuento_pct,
    }).eq("id", it.id);
    if(error) throw error;
    const subEl=$("#oi-sub-"+idx); if(subEl) subEl.textContent=fmt(it.cantidad*it.precio_unitario);
    const precEl=$("#oi-precio-"+idx);
    if(precEl){
      const prenda=window._pedCatMap[it.nombre_prenda];
      const curTalle=prenda?prenda.talles.find(t=>t.talleId===it.talle_id):null;
      const lista=oiListaFor(curTalle)||it.precio_unitario;
      precEl.innerHTML=`<b>${fmt(lista)}</b> lista<div class="oi-lista">c/u ${fmt(it.precio_unitario)}</div>`;
    }
    oiRecalcTotals();
  }catch(e){ toast(friendlyError(e),true); }
}
function oiChangeQty(idx,delta){
  const it=window._pedItems[idx]; if(!it) return;
  it.cantidad=Math.max(1, it.cantidad+delta);
  const qEl=$("#oi-qty-"+idx); if(qEl) qEl.textContent=it.cantidad;
  oiPersist(idx);
}
function oiChangeDesc(idx,val){
  const it=window._pedItems[idx]; if(!it) return;
  const prenda=window._pedCatMap[it.nombre_prenda];
  const curTalle=prenda?prenda.talles.find(t=>t.talleId===it.talle_id):null;
  const base=oiListaFor(curTalle);
  const d=Math.min(100,Math.max(0,+val||0));
  const el=$("#oi-desc-"+idx); if(el) el.value=d;
  if(base>0) it.precio_unitario=Math.round(base*(1-d/100));
  it.descuento_pct=d;
  oiPersist(idx);
}
async function oiChangeTalle(idx,talleId){
  const it=window._pedItems[idx]; if(!it) return;
  const prenda=window._pedCatMap[it.nombre_prenda]; if(!prenda) return;
  const nuevoTalle=prenda.talles.find(t=>t.talleId===talleId); if(!nuevoTalle) return;
  const viejoTalle=prenda.talles.find(t=>t.talleId===it.talle_id);
  const baseViejo=oiListaFor(viejoTalle);
  const descPct = baseViejo>0 ? Math.max(0, Math.round((1-it.precio_unitario/baseViejo)*100)) : 0;
  const baseNuevo=oiListaFor(nuevoTalle);
  it.talle_id=talleId; it.talle=nuevoTalle.talle; it.precio_unitario=Math.round(baseNuevo*(1-descPct/100));
  it.descuento_pct=descPct;
  try{
    const { data: costo } = await getClient().from("103_costo_vigente").select("costo").eq("talle_id",talleId).maybeSingle();
    if(costo) it.costo_unitario=Number(costo.costo)||0;
  }catch(e){}
  const row=$("#oi-row-"+idx); if(row) row.outerHTML=oiRowHtml(it,idx);
  oiPersist(idx);
}

async function facturarPedido(pedidoId){
  const p=(DATA.pedidos||[]).find(x=>x.id===pedidoId); if(!p) return;
  const btn=$("#fa-save"); btn.disabled=true; btn.textContent="Emitiendo…";
  try{
    const token=await getAccessToken(); if(!token) throw new Error("Sesión inválida, volvé a iniciar sesión");
    const docTipo=$("#fa-doctipo")?.value||"99";
    const docNro=$("#fa-docnro")?.value.trim()||"";
    const r=await fetch("/api/erp?action=facturar-supabase",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({
      pedidoId:p.id, clienteId:p.cliente_id||null, importe:p.total_venta, docTipo, docNro,
    })});
    const d=await r.json();
    if(!r.ok || d.error) throw new Error(d.error||"No se pudo facturar");
    if(d.yaFacturado){
      toast("El pedido ya estaba facturado");
    } else if(d.registrado===false){
      // La factura YA se emitió en ARCA con CAE real (eso no se puede deshacer)
      // pero no se pudo guardar la fila en 007_facturas -- si eso queda así,
      // el pedido se ve "sin facturar" y alguien puede volver a tocar
      // "Emitir Factura C" y emitir una SEGUNDA factura real por el mismo
      // pedido. Se reintenta guardar la fila una vez más acá mismo antes de
      // avisar nada.
      let guardada=false;
      try{
        const { error } = await getClient().from("007_facturas").insert(d.factura);
        guardada = !error;
      }catch(e){ guardada=false; }
      if(guardada){
        toast("Factura emitida");
      } else {
        const cae=d.factura?.cae||"—", comp=d.factura?.numero_comprobante||"—";
        // Se deja constancia en la nota del pedido para no perder el CAE aunque
        // se recargue la página -- es lo único persistente que queda si el
        // insert directo también falló.
        try{
          const notaActual=p.notas||"";
          const notaCae=`⚠ Factura C emitida en ARCA (CAE ${cae}, comprobante ${comp}) pero NO se pudo registrar en el sistema. NO volver a emitir para este pedido — avisar a Fede.`;
          await getClient().from("004_pedidos").update({ notas: notaActual?`${notaActual}\n\n${notaCae}`:notaCae }).eq("id", pedidoId);
        }catch(e){}
        toast(`⚠ Factura emitida en ARCA (CAE ${cae}) pero no se pudo registrar. NO reintentes — avisale a Fede con este CAE.`, true);
        btn.textContent="⚠ Facturada sin registrar"; // se queda deshabilitado a propósito
        DATA.pedidos=null; DATA.facturas=null; await getPedidos(true);
        return;
      }
    } else {
      toast("Factura emitida");
    }
    DATA.pedidos=null; DATA.facturas=null;
    await getPedidos(true);
    if(window._sheetPedidoId===pedidoId) openPedido(pedidoId);
    // Subir el PDF a Drive en segundo plano (no bloquea la UI recién reabierta).
    const pFresh=(DATA.pedidos||[]).find(x=>x.id===pedidoId);
    if(pFresh && pFresh.factura && !pFresh.factura.drive_link){
      subirFacturaDrive(pFresh.factura, pFresh).then(r=>{
        if(r.ok && window._sheetPedidoId===pedidoId){ const w=$("#fa-drive-wrap"); if(w) w.innerHTML=faDriveHtml(pFresh.factura); }
      });
    }
  }catch(e){ toast(friendlyError(e),true); btn.disabled=false; btn.textContent="Emitir Factura C"; }
}
async function subirFacturaDriveUI(pedidoId){
  const btn=$("#fa-drive-btn"); if(btn){ btn.disabled=true; btn.textContent="Subiendo…"; }
  const p=(DATA.pedidos||[]).find(x=>x.id===pedidoId);
  const r = p && p.factura ? await subirFacturaDrive(p.factura, p) : { ok:false, error:"Pedido no encontrado" };
  if(r.ok){ toast(r.yaExistia?"Ya estaba en Drive":"Factura guardada en Drive"); const w=$("#fa-drive-wrap"); if(w) w.innerHTML=faDriveHtml(p.factura); }
  else { toast(r.error||"No se pudo subir a Drive",true); if(btn){ btn.disabled=false; btn.textContent="Subir factura a Drive"; } }
}
// ── PDF de la factura (jsPDF, reusa /factura.js y /factura-pdf.js de /erp) + Drive ──
function loadScript(src){ return new Promise((res,rej)=>{
  const s=document.createElement("script"); s.src=src;
  const fin=(f,e)=>{ clearTimeout(t); f(e); };
  const t=setTimeout(()=>fin(rej,new Error("Tardó demasiado al cargar "+src)),25000);
  s.onload=()=>fin(res); s.onerror=()=>fin(rej,new Error("No se pudo cargar "+src)); document.head.appendChild(s);
}); }
async function ensurePdfLib(){
  if(!window.NORD_FACTURA) await loadScript("/factura.js");
  if(!window.jspdf||!window.jspdf.jsPDF) await loadScript("/jspdf.umd.min.js");
  if(!window.NORD_FACTURA_PDF) await loadScript("/factura-pdf.js");
}
function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
function buildFacturaDataGestion(factura, pedido){
  // El comprobante no muestra detalle de prendas ni nombre del cliente (ver factura-pdf.js):
  // solo importa el total y los datos fiscales del QR/factura.
  let fi={}; try{ fi=NORD_FACTURA.parseQr(factura.qr_url); }catch(e){}
  return {
    cuit: fi.cuit, ptoVta: fi.ptoVta, nroCmp: fi.nroCmp, tipoCmp: fi.tipoCmp||11,
    fechaISO: fi.fecha, cae: fi.codAut!=null?fi.codAut:factura.cae,
    caeVto: String(factura.cae_vencimiento||"").replace(/-/g,""),
    importe: fi.importe!=null?fi.importe:factura.importe,
    receptorTipo: fi.tipoDocRec, receptorNro: fi.nroDocRec,
    id: pedido.numero, ambiente: factura.ambiente||"", qrUrl: factura.qr_url,
  };
}
// Genera el PDF y lo sube a Drive vía /api/erp (action=drive-factura, autorizado con el
// mismo token de Supabase Auth). Devuelve {ok, link, error} — nunca lanza ni bloquea el
// flujo principal de facturación, que ya quedó guardado en 007_facturas de todas formas.
async function subirFacturaDrive(factura, pedido){
  try{
    if(!factura.qr_url) return { ok:false, error:"La factura no tiene QR" };
    await ensurePdfLib();
    const data=buildFacturaDataGestion(factura, pedido);
    const { blob, filename } = NORD_FACTURA_PDF.generate(data);
    const b64 = await blobToBase64(blob);
    const token = await getAccessToken(); if(!token) return { ok:false, error:"Sesión inválida" };
    const r = await fetch("/api/erp?action=drive-factura",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({filename, pdfBase64:b64})});
    const d = await r.json();
    if(!r.ok || !d.link) return { ok:false, error:d.error||"No se pudo subir a Drive" };
    try{ await getClient().from("007_facturas").update({ drive_link:d.link }).eq("id", factura.id); }catch(e){}
    factura.drive_link=d.link;
    DATA.pedidos=null; DATA.facturas=null;
    return { ok:true, link:d.link, yaExistia:d.yaExistia };
  }catch(e){ return { ok:false, error:e.message }; }
}
// Las facturas emitidas antes de que existiera drive_link (o cuando falló la
// subida automática) no tienen link — Contabilidad ofrece subirla ahí mismo,
// sin tener que abrir el pedido.
function faContabilidadDriveHtml(f){
  return f.drive_link
    ? `<a href="${esc(f.drive_link)}" target="_blank" rel="noopener">Ver en Drive</a>`
    : `<button class="btn ghost sm" id="fa-drive-btn-${f.id}" onclick='subirFacturaDriveDesdeContabilidad(${JSON.stringify(f.id)})'>Subir a Drive</button>`;
}
async function subirFacturaDriveDesdeContabilidad(facturaId){
  const f=(DATA.facturas||[]).find(x=>x.id===facturaId); if(!f) return;
  const btn=$("#fa-drive-btn-"+CSS.escape(facturaId)); if(btn){ btn.disabled=true; btn.textContent="Subiendo…"; }
  try{
    const pedidoLike={ id:f.pedido_id, numero:f.pedidoNumero };
    const r = await subirFacturaDrive(f, pedidoLike);
    if(r.ok){
      toast(r.yaExistia?"Ya estaba en Drive":"Factura guardada en Drive");
      const cell=$("#fa-drivecell-"+CSS.escape(facturaId)); if(cell) cell.innerHTML=faContabilidadDriveHtml(f);
    } else {
      toast(r.error||"No se pudo subir a Drive", true);
      if(btn){ btn.disabled=false; btn.textContent="Subir a Drive"; }
    }
  }catch(e){ toast(friendlyError(e),true); if(btn){ btn.disabled=false; btn.textContent="Subir a Drive"; } }
}

// El código de cliente (WSxx) sale de 003_clientes.nro (default nextval de una
// secuencia). Para que un cliente borrado "libere" su número en vez de perderlo
// para siempre, calculamos acá el menor número libre y lo mandamos explícito en
// el insert (nro admite valor explícito, la secuencia es sólo el default).
function nextClienteNro(){
  const usados = new Set((DATA.clientes||[]).map(c=>Number(c.nro)||0));
  let n=1; while(usados.has(n)) n++;
  return n;
}

async function fetchCompras(){
  const c = getClient();
  const [{ data, error }, { data: talles }, { data: prendas }, { data: provs }] = await Promise.all([
    c.from("009_compras").select("id,numero,fecha,cantidad,costo_unitario,estado,sku_original,proveedor_id,talle_id").order("fecha",{ascending:false}).limit(300),
    c.from("002_talles").select("id,talle,sku,product_id"),
    c.from("001_prendas").select("id,nombre"),
    c.from("008_proveedores").select("id,nombre"),
  ]);
  if(error) throw error;
  const prendaNombre = Object.fromEntries((prendas||[]).map(p=>[p.id,p.nombre]));
  const talleMap = Object.fromEntries((talles||[]).map(t=>[t.id, { ...t, prendaNombre: prendaNombre[t.product_id] }]));
  const provMap = Object.fromEntries((provs||[]).map(p=>[p.id,p.nombre]));
  return (data||[]).map(co=>{
    const t = talleMap[co.talle_id];
    return { ...co, prenda: t?t.prendaNombre:null, talleNombre: t?t.talle:null, proveedorNombre: provMap[co.proveedor_id]||"" };
  });
}

function coEditCell(span){
  if(span.querySelector("input")) return;
  const id=span.dataset.id, field=span.dataset.field, isText=span.dataset.type==="text";
  const co=(DATA.compras||[]).find(x=>x.id===id); if(!co) return;
  const cur=co[field];
  const display=(v)=> field==="costo_unitario"?fmt(v):esc(v||"");
  span.innerHTML=`<input type="text" ${isText?"":'inputmode="numeric"'} value="${esc(isText?(cur||""):fmtMiles(cur))}">`;
  const input=span.querySelector("input");
  input.focus(); input.select();
  let done=false;
  const parse=(raw)=> isText?raw.trim():parseMiles(raw);
  const cancel=()=>{ if(done) return; done=true; span.innerHTML=display(cur); };
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); if(done) return; done=true; coSaveCell(id, field, parse(input.value), true); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", ()=>{ if(done) return; done=true; coSaveCell(id, field, parse(input.value), false); });
}
async function coSaveCell(id, field, value, moveNext){
  const co=(DATA.compras||[]).find(x=>x.id===id); if(!co) return;
  const span=document.querySelector(`.pr-editable[data-id="${id}"][data-field="${field}"]`);
  const display=(v)=> field==="costo_unitario"?fmt(v):esc(v||"");
  if(value===co[field]){ if(span) span.innerHTML=display(co[field]); if(moveNext) coFocusNext(id, field); return; }
  try{
    if(field==="cantidad" && !value) throw new Error("Ingresá una cantidad válida");
    if(field==="numero" && !value) throw new Error("El N° de compra no puede quedar vacío");
    const { error } = await getClient().from("009_compras").update({ [field]: value }).eq("id", id);
    if(error) throw error;
    co[field]=value;
    if(span) span.innerHTML=display(value);
    const subEl=$("#co-sub-"+CSS.escape(id)); if(subEl) subEl.textContent=fmt((Number(co.cantidad)||0)*(Number(co.costo_unitario)||0));
    if(moveNext) coFocusNext(id, field);
  }catch(e){
    toast(friendlyError(e),true);
    if(span) span.innerHTML=display(co[field]);
  }
}
function coFocusNext(id, field){
  const list=window._coList||[];
  const idx=list.findIndex(x=>x.id===id);
  if(idx<0 || idx>=list.length-1) return;
  const next=list[idx+1];
  const span=document.querySelector(`.pr-editable[data-id="${next.id}"][data-field="${field}"]`);
  if(span) coEditCell(span);
}

async function fetchPreciosCostos(){
  const c = getClient();
  const [{ data: prendas }, { data: talles }, { data: precios }, { data: costos }] = await Promise.all([
    c.from("001_prendas").select("id,nombre"),
    c.from("002_talles").select("id,product_id,talle,sku"),
    c.from("102_precio_vigente").select("*"),
    c.from("103_costo_vigente").select("*"),
  ]);
  const prendaNombre = Object.fromEntries((prendas||[]).map(p=>[p.id,p.nombre]));
  const precioMap = Object.fromEntries((precios||[]).map(p=>[p.talle_id,p]));
  const costoMap = Object.fromEntries((costos||[]).map(c2=>[c2.talle_id,c2]));
  return (talles||[]).map(t=>{
    const pr=precioMap[t.id]||{}, co=costoMap[t.id]||{};
    const precio=Number(pr.precio_transferencia)||0, costo=Number(co.costo)||0;
    return { talleId:t.id, nombre:prendaNombre[t.product_id]||"", talle:t.talle, sku:t.sku,
      precioLista:Number(pr.precio_lista)||0, precio, costo, margen: precio>0?((precio-costo)/precio*100):null };
  }).sort((a,b)=> a.nombre.localeCompare(b.nombre) || compareTalle(a.talle,b.talle));
}

function prEditCell(span){

  const talleId=span.dataset.talle, field=span.dataset.field;
  const r=(DATA.preciosCostos||[]).find(x=>x.talleId===talleId); if(!r) return;

  });

async function prSaveCell(talleId, field, value, moveNext){
  const r=(DATA.preciosCostos||[]).find(x=>x.talleId===talleId); if(!r) return;
  const span=document.querySelector(`.pr-editable[data-talle="${talleId}"][data-field="${field}"]`);
  // Si no se tocó el valor no insertamos nada — 010_precios/011_costos_reposicion
  // son histórico append-only, y reinsertar el mismo valor de hoy pisa la fila
  // que ya existía para (talle, hoy) y tira "duplicate value".
  if(value===r[field]){
    if(span) span.innerHTML=fmt(r[field]);
    if(moveNext) prFocusNext(talleId, field);
    return;
  }
  try{
    if(field==="costo"){
      if(!value) throw new Error("Ingresá un costo válido");
      const { error } = await getClient().from("011_costos_reposicion").insert({ talle_id:talleId, costo:value, vigente_desde:todayISO() });
      if(error) throw error;
      r.costo=value;
    } else {
      const nuevoLista = field==="precioLista"?value:r.precioLista;
      const nuevoTrans = field==="precio"?value:r.precio;
      if(!nuevoLista&&!nuevoTrans) throw new Error("Ingresá al menos un precio");
      const { error } = await getClient().from("010_precios").insert({ talle_id:talleId, precio_lista:nuevoLista, precio_transferencia:nuevoTrans, vigente_desde:todayISO() });
      if(error) throw error;
      r.precioLista=nuevoLista; r.precio=nuevoTrans;
      DATA.catalogo=null; // Vender usa estos mismos precios vigentes
    }
    r.margen = r.precio>0 ? ((r.precio-r.costo)/r.precio*100) : null;
    const row=$("#pr-row-"+CSS.escape(talleId)); if(row) row.outerHTML=prRowHtml(r);
    if(moveNext) prFocusNext(talleId, field);
  }catch(e){
    toast(friendlyError(e),true);
    if(span) span.innerHTML=fmt(r[field]);
  }
}
function prFocusNext(talleId, field){
  const list=window._prList||[];
  const idx=list.findIndex(x=>x.talleId===talleId);
  if(idx<0 || idx>=list.length-1) return;
  const next=list[idx+1];
  const span=document.querySelector(`.pr-editable[data-talle="${next.talleId}"][data-field="${field}"]`);
  if(span) prEditCell(span);
}

async function prBulkApply(){

      const r=(DATA.preciosCostos||[]).find(x=>x.talleId===talleId);
      return { talle_id:talleId,

  simularPrecio(talleId);
