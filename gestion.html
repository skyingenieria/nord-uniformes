// field: cuál input disparó el evento ("lista"|"trans"|"costo"|undefined en la llamada inicial).
// Mientras no se toque "transferencia" a mano, se recalcula sola manteniendo la proporción
// lista→transferencia original — así cambiar sólo el precio de lista también mueve el margen.
function simularPrecio(talleId, field){
  const r=(DATA.preciosCostos||[]).find(x=>x.talleId===talleId); if(!r) return;
  if(field==="trans") window._spTransTouched=true;
  const nuevoLista=parseMiles($("#sp-lista").value);
  if(field==="lista" && !window._spTransTouched){
    const ratio = r.precioLista>0 ? (r.precio/r.precioLista) : 0.9;
    $("#sp-trans").value=fmtMiles(Math.round(nuevoLista*ratio));
  }
  const nuevoTrans=parseMiles($("#sp-trans").value);
  const costo=parseMiles($("#sp-costo").value);
  // Sólo reformatea los campos que no tienen el foco, para no pelear con lo que se está tipeando.
  const active=document.activeElement;
  if(active?.id!=="sp-lista") $("#sp-lista").value=fmtMiles(nuevoLista);
  if(active?.id!=="sp-costo") $("#sp-costo").value=fmtMiles(costo);
  if(active?.id!=="sp-trans") $("#sp-trans").value=fmtMiles(nuevoTrans);
  const nuevoMargen = nuevoTrans>0 ? ((nuevoTrans-costo)/nuevoTrans*100) : null;
  const el=$("#sp-result"); if(!el) return;
  el.innerHTML=`<div class="tot-line"><span>Margen simulado</span><span class="${margenClass(nuevoMargen)}" style="font-weight:800">${nuevoMargen!=null?nuevoMargen.toFixed(1)+"%":"—"}</span></div>
    <div class="tot-line"><span>Ganancia por unidad</span><span>${fmt(nuevoTrans-costo)}</span></div>`;
}
async function aplicarPrecio(talleId){
  const nuevoLista=parseMiles($("#sp-lista").value), nuevoTrans=parseMiles($("#sp-trans").value);
  if(!nuevoLista&&!nuevoTrans) return toast("Ingresá al menos un precio",true);
  const btn=$("#sp-save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    const { error } = await getClient().from("010_precios").insert({ talle_id:talleId, precio_lista:nuevoLista, precio_transferencia:nuevoTrans||Math.round(nuevoLista*0.9), vigente_desde:todayISO() });

  }catch(e){ toast(friendlyError(e),true); btn.disabled=false; btn.textContent="Aplicar nuevo precio (desde hoy)"; }
}
async function aplicarCosto(talleId){

async function fetchFacturas(){
  const c = getClient();
  const [{ data: facturas, error }, { data: pedidos }, { data: clientes }] = await Promise.all([
    c.from("007_facturas").select("*").order("fecha",{ascending:false}).order("numero_comprobante",{ascending:false}),
    c.from("004_pedidos").select("id,numero,cliente_id"),
    c.from("003_clientes").select("id,nombre,apellido"),
  ]);
  if(error) throw error;
  const pedMap = Object.fromEntries((pedidos||[]).map(p=>[p.id,p]));
  const cliMap = Object.fromEntries((clientes||[]).map(c2=>[c2.id,c2]));
  return (facturas||[]).map(f=>{
    const ped = pedMap[f.pedido_id];
    const cli = cliMap[f.cliente_id] || (ped ? cliMap[ped.cliente_id] : null);
    return { ...f, pedidoNumero: ped?ped.numero:"", clienteNombre: cli?`${cli.nombre||""} ${cli.apellido||""}`.trim():"" };
  });
}

function gaDisplay(g,field){
  if(field==="monto") return fmt(g.monto);
  return esc(g[field] || ((field==="proveedor"||field==="descripcion")?"—":""));
}
function gaCategoriaSelectHtml(g){
  const cats = GASTO_CATEGORIAS.includes(g.categoria) || !g.categoria ? GASTO_CATEGORIAS : [g.categoria, ...GASTO_CATEGORIAS];
  return `<select onchange="gaSaveCell('${g.id}','categoria',this.value)">${cats.map(c=>
    `<option value="${esc(c)}" ${c===g.categoria?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
}
function gaRowHtml(g){
  return `<tr id="ga-row-${g.id}">
    <td class="pr-editable" data-id="${g.id}" data-field="fecha" data-type="text" onclick="gaEditCell(this)">${esc(g.fecha||"")}</td>
    <td>${gaCategoriaSelectHtml(g)}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="monto" data-type="num" onclick="gaEditCell(this)">${gaDisplay(g,"monto")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="proveedor" data-type="text" onclick="gaEditCell(this)">${gaDisplay(g,"proveedor")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="descripcion" data-type="text" onclick="gaEditCell(this)">${gaDisplay(g,"descripcion")}</td>
    <td><button type="button" class="oi-del" title="Eliminar" onclick='gaDeleteGasto(${JSON.stringify(g.id)})'>✕</button></td>
  </tr>`;
}
function gaEditCell(td){
  if(td.querySelector("input")) return;
  const id=td.dataset.id, field=td.dataset.field, type=td.dataset.type;
  const g=(DATA.gastos||[]).find(x=>x.id===id); if(!g) return;
  const inputVal = type==="num" ? fmtMiles(g.monto) : (g[field]??"");
  td.innerHTML=`<input type="text" ${type==="num"?'inputmode="numeric"':""} value="${esc(inputVal)}">`;
  const input=td.querySelector("input");
  input.focus(); input.select();
  let done=false;
  const cancel=()=>{ if(done) return; done=true; td.innerHTML=gaDisplay(g,field); };
  const commit=()=>{ if(done) return; done=true; gaSaveCell(id, field, type==="num"?parseMiles(input.value):input.value.trim()); };
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", commit);
}
async function gaSaveCell(id, field, value){
  const g=(DATA.gastos||[]).find(x=>x.id===id); if(!g) return;
  const td=document.querySelector(`.pr-editable[data-id="${id}"][data-field="${field}"]`);
  const isOptional = field==="proveedor" || field==="descripcion";
  const curVal = g[field]==null ? "" : g[field];
  if(String(value)===String(curVal)){ if(td) td.innerHTML=gaDisplay(g,field); return; }
  if(field==="monto" && !(value>0)){ toast("Ingresá un monto válido",true); if(td) td.innerHTML=gaDisplay(g,field); return; }
  if(field==="categoria" && !value){ toast("La categoría no puede quedar vacía",true); if(td) td.innerHTML=gaDisplay(g,field); return; }
  if(field==="fecha" && !value){ toast("La fecha no puede quedar vacía",true); if(td) td.innerHTML=gaDisplay(g,field); return; }
  try{
    const patch={ [field]: isOptional && !value ? null : value };
    const { error } = await getClient().from("013_gastos").update(patch).eq("id", id);
    if(error) throw error;
    Object.assign(g, patch);
    if(td) td.innerHTML=gaDisplay(g,field);
  }catch(e){ toast(friendlyError(e),true); if(td) td.innerHTML=gaDisplay(g,field); }
}
async function gaAddGasto(){
  const categoria=$("#ga-cat").value.trim();
  const fecha=$("#ga-fecha").value.trim()||todayISO();
  const monto=parseMiles($("#ga-monto").value);
  const proveedor=$("#ga-prov").value.trim();
  const descripcion=$("#ga-desc").value.trim();
  if(!categoria) return toast("Elegí o escribí una categoría",true);
  if(!(monto>0)) return toast("Ingresá un monto válido",true);
  const btn=document.querySelector("#ga-add-row button");
  if(btn){ btn.disabled=true; btn.textContent="Agregando…"; }
  try{
    const { data, error } = await getClient().from("013_gastos").insert({
      categoria, fecha, monto, proveedor: proveedor||null, descripcion: descripcion||null,
    }).select().single();
    if(error) throw error;
    DATA.gastos=[data, ...(DATA.gastos||[])];
    $("#ga-monto").value=""; $("#ga-prov").value=""; $("#ga-desc").value=""; $("#ga-fecha").value=todayISO();
    const tbody=$("#ga-tbody");
    if(tbody){
      if(tbody.querySelector(".empty")) tbody.innerHTML="";
      tbody.insertAdjacentHTML("afterbegin", gaRowHtml(data));
    }
    toast("Gasto registrado");
  }catch(e){ toast(friendlyError(e),true); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="+ Agregar"; } }
}
async function gaDeleteGasto(id){
  const g=(DATA.gastos||[]).find(x=>x.id===id); if(!g) return;
  if(!(await confirmDialog(`¿Eliminar el gasto "${g.categoria}" de ${fmt(g.monto)}?`))) return;
  try{
    const { error } = await getClient().from("013_gastos").delete().eq("id", id);
    if(error) throw error;
    DATA.gastos=(DATA.gastos||[]).filter(x=>x.id!==id);
    const row=$("#ga-row-"+id); if(row) row.remove();
    toast("Gasto eliminado");
  }catch(e){ toast(friendlyError(e),true); }
}

  try{
    if(force||!DATA.egresos){ loading(v); await getEgresos(true); }
    window._egQ = window._egQ||"";
    window._egSort = window._egSort||{field:"fecha",dir:-1};
    const list0=DATA.egresos||[];
    v.innerHTML=`
      <div class="view-title">Egresos</div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-8px">Pagos o aportes extraordinarios (plata que pone Flor o Fede). No se relaciona con ninguna otra tabla — es solo un registro.</p>
      <div class="card" style="margin-bottom:14px">
        <div class="section-h" style="margin-top:0">+ Nuevo egreso</div>
        <div class="oi-add eg-add" id="eg-add-row">
          <input type="text" id="eg-fecha" value="${todayISO()}">
          <input type="text" id="eg-pagado" placeholder="Pagado por (Flor/Fede/...)">
          <input type="text" id="eg-prov" placeholder="Proveedor (opcional)">
          <select id="eg-moneda">${EGRESO_MONEDAS.map(m=>`<option value="${m}">${m}</option>`).join("")}</select>
          <input type="text" inputmode="numeric" id="eg-monto" placeholder="Monto">
          <input type="text" id="eg-comentario" placeholder="Comentario (opcional)">
          <button type="button" class="btn ghost sm" onclick="egAddEgreso()">+ Agregar</button>
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-6px">${list0.length} egreso${list0.length!==1?"s":""} registrado${list0.length!==1?"s":""}. Todas las celdas son editables.</p>
      <div class="search"><span class="mag">🔎</span><input id="eg-q" placeholder="Buscar proveedor, compra o comentario…" value="${esc(window._egQ)}"></div>
      <div class="table-wrap"><table class="pr-table" id="eg-table">
        <colgroup><col style="width:9%"><col style="width:12%"><col style="width:13%"><col style="width:9%"><col style="width:7%"><col style="width:9%"><col style="width:10%"><col style="width:26%"><col style="width:5%"></colgroup>
        <thead><tr>
          <th data-field="fecha">Fecha</th>
          <th data-field="pagado_por">Pagado por</th>
          <th data-field="proveedor">Proveedor</th>
          <th data-field="compra_ref">Compra</th>
          <th data-field="moneda">Moneda</th>
          <th data-field="monto_total">Monto</th>
          <th data-field="estado">Estado</th>
          <th data-field="comentario">Comentario</th>
          <th></th>
        </tr></thead>
        <tbody id="eg-tbody"></tbody>
      </table></div>`;
    const inp=$("#eg-q");
    const draw=()=>{
      const q=inp.value.trim().toLowerCase(); window._egQ=inp.value;
      const {field,dir}=window._egSort;
      const list=(DATA.egresos||[]).filter(g=>!q||`${g.pagado_por||""} ${g.proveedor||""} ${g.compra_ref||""} ${g.comentario||""}`.toLowerCase().includes(q)).sort((a,b)=>{
        const av=a[field], bv=b[field];
        if(typeof av==="string"||typeof bv==="string") return String(av||"").localeCompare(String(bv||""),"es")*dir;
        return ((av??-Infinity)-(bv??-Infinity))*dir;
      });
      $("#eg-tbody").innerHTML=list.length?list.map(g=>egRowHtml(g)).join("")
        : `<tr><td colspan="9"><div class="empty">Sin egresos todavía</div></td></tr>`;
      $("#eg-table").querySelectorAll("th[data-field]").forEach(th=>{
        th.classList.toggle("sorted", th.dataset.field===field);
        th.querySelectorAll(".arrow").forEach(a=>a.remove());
        if(th.dataset.field===field) th.insertAdjacentHTML("beforeend", `<span class="arrow">${dir>0?"▲":"▼"}</span>`);
      });
    };
    inp.oninput=draw;
    $("#eg-table").querySelectorAll("th[data-field]").forEach(th=>{
      th.onclick=()=>{
        const f=th.dataset.field;
        if(window._egSort.field===f) window._egSort.dir*=-1; else window._egSort={field:f,dir:f==="fecha"?-1:1};
        draw();
      };
    });
    draw();
  }catch(e){ errBox(v,e); }
}
function egDisplay(g,field){
  if(field==="monto_total") return fmt(g.monto_total);
  return esc(g[field] || (["proveedor","compra_ref","estado","comentario"].includes(field)?"—":""));
}
function egRowHtml(g){
  const monedaHtml = `<select onchange="egSaveCell('${g.id}','moneda',this.value)">${EGRESO_MONEDAS.map(m=>
    `<option value="${m}" ${m===g.moneda?"selected":""}>${m}</option>`).join("")}</select>`;
  return `<tr id="eg-row-${g.id}">
    <td class="pr-editable" data-id="${g.id}" data-field="fecha" data-type="text" onclick="egEditCell(this)">${esc(g.fecha||"")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="pagado_por" data-type="text" onclick="egEditCell(this)">${egDisplay(g,"pagado_por")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="proveedor" data-type="text" onclick="egEditCell(this)">${egDisplay(g,"proveedor")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="compra_ref" data-type="text" onclick="egEditCell(this)">${egDisplay(g,"compra_ref")}</td>
    <td>${monedaHtml}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="monto_total" data-type="num" onclick="egEditCell(this)">${egDisplay(g,"monto_total")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="estado" data-type="text" onclick="egEditCell(this)">${egDisplay(g,"estado")}</td>
    <td class="pr-editable" data-id="${g.id}" data-field="comentario" data-type="text" onclick="egEditCell(this)">${egDisplay(g,"comentario")}</td>
    <td><button type="button" class="oi-del" title="Eliminar" onclick="egDeleteEgreso('${g.id}')">✕</button></td>
  </tr>`;
}
function egEditCell(td){
  if(td.querySelector("input")) return;
  const id=td.dataset.id, field=td.dataset.field, type=td.dataset.type;
  const g=(DATA.egresos||[]).find(x=>x.id===id); if(!g) return;
  const inputVal = type==="num" ? fmtMiles(g.monto_total) : (g[field]??"");
  td.innerHTML=`<input type="text" ${type==="num"?'inputmode="numeric"':""} value="${esc(inputVal)}">`;
  const input=td.querySelector("input");
  input.focus(); input.select();
  let done=false;
  const cancel=()=>{ if(done) return; done=true; td.innerHTML=egDisplay(g,field); };
  const commit=()=>{ if(done) return; done=true; egSaveCell(id, field, type==="num"?parseMiles(input.value):input.value.trim()); };
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(); }
    else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", commit);
}
async function egSaveCell(id, field, value){
  const g=(DATA.egresos||[]).find(x=>x.id===id); if(!g) return;
  const td=document.querySelector(`.pr-editable[data-id="${id}"][data-field="${field}"]`);
  const isOptional = field!=="fecha" && field!=="pagado_por" && field!=="monto_total" && field!=="moneda";
  const curVal = g[field]==null ? "" : g[field];
  if(String(value)===String(curVal)){ if(td) td.innerHTML=egDisplay(g,field); return; }
  if(field==="monto_total" && !value && value!==0){ toast("Ingresá un monto válido",true); if(td) td.innerHTML=egDisplay(g,field); return; }
  if(field==="pagado_por" && !value){ toast("El campo 'Pagado por' no puede quedar vacío",true); if(td) td.innerHTML=egDisplay(g,field); return; }
  if(field==="fecha" && !value){ toast("La fecha no puede quedar vacía",true); if(td) td.innerHTML=egDisplay(g,field); return; }
  try{
    const patch={ [field]: isOptional && !value ? null : value };
    const { error } = await getClient().from("015_egresos").update(patch).eq("id", id);
    if(error) throw error;
    Object.assign(g, patch);
    if(td) td.innerHTML=egDisplay(g,field);
  }catch(e){ toast(friendlyError(e),true); if(td) td.innerHTML=egDisplay(g,field); }
}
async function egAddEgreso(){
  const pagado_por=$("#eg-pagado").value.trim();
  const fecha=$("#eg-fecha").value.trim()||todayISO();
  const proveedor=$("#eg-prov").value.trim();
  const moneda=$("#eg-moneda").value;
  const monto_total=parseMiles($("#eg-monto").value);
  const comentario=$("#eg-comentario").value.trim();
  if(!pagado_por) return toast("Decí quién pagó",true);
  if(!monto_total) return toast("Ingresá un monto válido",true);
  const btn=document.querySelector("#eg-add-row button");
  if(btn){ btn.disabled=true; btn.textContent="Agregando…"; }
  try{
    const { data, error } = await getClient().from("015_egresos").insert({
      pagado_por, fecha, proveedor: proveedor||null, moneda, monto_total, comentario: comentario||null,
    }).select().single();
    if(error) throw error;
    DATA.egresos=[data, ...(DATA.egresos||[])];
    $("#eg-pagado").value=""; $("#eg-prov").value=""; $("#eg-monto").value=""; $("#eg-comentario").value=""; $("#eg-fecha").value=todayISO();
    const tbody=$("#eg-tbody");
    if(tbody){
      if(tbody.querySelector(".empty")) tbody.innerHTML="";
      tbody.insertAdjacentHTML("afterbegin", egRowHtml(data));
    }
    toast("Egreso registrado");
  }catch(e){ toast(friendlyError(e),true); }
  finally{ if(btn){ btn.disabled=false; btn.textContent="+ Agregar"; } }
}
async function egDeleteEgreso(id){
  const g=(DATA.egresos||[]).find(x=>x.id===id); if(!g) return;
  if(!(await confirmDialog(`¿Eliminar el egreso de "${g.pagado_por}" por ${fmt(g.monto_total)}?`))) return;
  try{
    const { error } = await getClient().from("015_egresos").delete().eq("id", id);
    if(error) throw error;
    DATA.egresos=(DATA.egresos||[]).filter(x=>x.id!==id);
    const row=$("#eg-row-"+id); if(row) row.remove();
    toast("Egreso eliminado");
  }catch(e){ toast(friendlyError(e),true); }
}

// ─────────────────────────────────────────────────────────────── SHEET
function openSheet(html){ $("#sheet").innerHTML='<div class="sheet-topbar"><button class="sheet-close" onclick="closeSheet()" aria-label="Cerrar">✕</button></div>'+html; $("#sheet-bg").classList.add("open"); sheetOpen=true; updateBack(); }
// Variante centrada/más arriba (no bottom-sheet) para modales que necesitan más foco, ej. Registrar compra.
function openCenterSheet(html){ $("#sheet-bg").classList.add("center"); openSheet(html); }
function openWideSheet(html){ $("#sheet-bg").classList.add("wide"); openSheet(html); }
function closeSheet(){ $("#sheet-bg").classList.remove("open","center","wide"); sheetOpen=false; updateBack(); }

// ─────────────────────────────────────────────────────────────── CONFIRM
let _confirmResolve=null;
function confirmDialog(message, confirmLabel){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    $("#confirm-msg").textContent=message;
    const okBtn=$("#confirm-ok-btn"); if(okBtn) okBtn.textContent=confirmLabel||"Eliminar";
    $("#confirm-bg").classList.add("open");
  });
}
function _resolveConfirm(v){
  $("#confirm-bg").classList.remove("open");
  if(_confirmResolve){ const r=_confirmResolve; _confirmResolve=null; r(v); }
}

// ─────────────────────────────────────────────────────────────── INIT
window.addEventListener("popstate",()=>{
  if(sheetOpen){ closeSheet(); history.pushState({tab:TAB},""); return; }
  if(navStack.length){ go(navStack.pop(), {push:false}); }
});
document.addEventListener("DOMContentLoaded", async ()=>{
  const c = getClient();
  const { data: { session } } = await c.auth.getSession();
  if(session){ await loadProfile(session.user.id); if(PROFILE){ showApp(); return; } }
  $("#login").style.display="flex";
});
$("#l-pass")?.addEventListener("keydown",e=>{ if(e.key==="Enter")login(); });
</script>
