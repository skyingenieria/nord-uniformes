<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comprobante — NORD Uniformes</title>
<link rel="icon" href="/nord-icon.svg">
<link rel="stylesheet" href="/factura.css">
<style>
  body{margin:0;background:#e9ebef}
  .bar{position:sticky;top:0;background:#0F172E;color:#fff;display:flex;gap:10px;justify-content:center;padding:10px;z-index:5}
  .bar button{border:none;border-radius:8px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .bar .print{background:#C8A96E;color:#0F172E}
  .bar .close{background:rgba(255,255,255,.14);color:#fff}
  .wrap{max-width:800px;margin:16px auto;box-shadow:0 3px 16px rgba(0,0,0,.15)}
  #err{max-width:800px;margin:40px auto;text-align:center;color:#a12a2a}
  @media print{ body{background:#fff} .bar{display:none} .wrap{box-shadow:none;margin:0;max-width:none} @page{size:A4;margin:14mm} }
</style>
</head>
<body>
<div class="bar">
  <button class="print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <button class="close" onclick="window.close()">Cerrar</button>
</div>
<div class="fac"><div class="wrap" id="cont"></div></div>
<div id="err" style="display:none">No se pudo cargar el comprobante.</div>

<script src="/qrcode.js"></script>
<script src="/factura.js"></script>
<script>
try{
  const d = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));  // { qr, caeVto, cliente, id, ambiente, tipoReceptor, items }
  const f = NORD_FACTURA.parseQr(d.qr);   // payload fiscal AFIP
  const data = {
    cuit:f.cuit, ptoVta:f.ptoVta, nroCmp:f.nroCmp, tipoCmp:f.tipoCmp,
    fechaISO:f.fecha, cae:f.codAut, caeVto:d.caeVto, importe:f.importe,
    receptorTipo:f.tipoDocRec, receptorNro:f.nroDocRec,
    cliente:d.cliente, id:d.id, items:d.items, ambiente:d.ambiente, qrUrl:d.qr,
  };
  const built = NORD_FACTURA.build(data);
  const cont = document.getElementById("cont");
  cont.innerHTML = built.html;
  NORD_FACTURA.drawQR(cont, d.qr);
  document.title = built.filename.replace(/\.pdf$/,"");
}catch(e){
  document.getElementById("err").style.display="block";
  document.getElementById("err").textContent = "No se pudo cargar el comprobante: " + e.message;
}
</script>
</body>
</html>
